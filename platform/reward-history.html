<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
📜 سجل المكافآت
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:
linear-gradient(
135deg,
#eef4ff,
#f3efff
);

padding:35px 18px 60px;

min-height:100vh;

}

.container{

max-width:1100px;
margin:auto;

}

/* الأعلى */

.header{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:35px;

}

.logo{

width:82px;
height:82px;
border-radius:50%;
object-fit:cover;

}

.backBtn{

background:white;

border:none;

padding:14px 22px;

border-radius:18px;

font-size:22px;

font-weight:bold;

color:#1f3c88;

cursor:pointer;

box-shadow:
0 10px 25px rgba(0,0,0,.08);

}

.hero{

background:white;

border-radius:28px;

padding:35px;

box-shadow:
0 18px 45px rgba(0,0,0,.08);

text-align:center;

margin-bottom:35px;

}

.hero h1{

font-size:38px;

color:#1f3c88;

margin-bottom:18px;

}

.hero p{

font-size:22px;

color:#555;

line-height:1.9;

}

/* السجل */

.history{

display:flex;

flex-direction:column;

gap:22px;

}

.history-card{

background:white;

border-radius:25px;

padding:28px;

box-shadow:
0 15px 35px rgba(0,0,0,.08);

display:flex;

justify-content:space-between;

align-items:center;

}

.left h2{

font-size:26px;

color:#1f3c88;

margin-bottom:10px;

}

.left p{

font-size:18px;

color:#777;

}

.right{

text-align:center;

}

.coins{

font-size:34px;

font-weight:bold;

color:#ffb300;

margin-bottom:8px;

}

.type{

font-size:17px;

color:#666;

}

@media(max-width:768px){

.hero h1{

font-size:30px;

}

.hero p{

font-size:18px;

}

.history-card{

flex-direction:column;

gap:18px;

text-align:center;

}

.left h2{

font-size:22px;

}

.left p{

font-size:16px;

}

.coins{

font-size:30px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<img
src="../owl.PNG"
class="logo">

<button
class="backBtn"
onclick="history.back()">

⬅️ رجوع

</button>

</div>

<div class="hero">

<h1>

📜 سجل المكافآت

</h1>

<p>

هنا ستجد جميع العملات التي حصلت عليها،
ومتى حصلت عليها أثناء رحلتك التعليمية.

</p>

</div>

<div
class="history"
id="historyContainer">

</div>

</div>

</body>

</html>
