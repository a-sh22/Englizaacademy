<title>
📖 بنك الكلمات
</title>


<style>

/* ==========================================================
   RESET
========================================================== */

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}


/* ==========================================================
   BODY
========================================================== */

body{

background:
linear-gradient(
135deg,
#eef4ff,
#f3efff
);

padding:35px 18px 60px;

min-height:100vh;

color:#222;

}


/* ==========================================================
   CONTAINER
========================================================== */

.container{

width:100%;

max-width:1100px;

margin:0 auto;

}


/* ==========================================================
   HEADER
========================================================== */

.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:35px;

width:100%;

}


/* ==========================================================
   LOGO
========================================================== */

.logo{

width:82px;

height:82px;

border-radius:50%;

object-fit:cover;

display:block;

}


/* ==========================================================
   BACK BUTTON
========================================================== */

.backBtn{

background:white;

border:none;

padding:14px 22px;

border-radius:18px;

font-size:22px;

font-weight:bold;

color:#1f3c88;

cursor:pointer;

box-shadow:
0 10px 25px
rgba(0,0,0,.08);

transition:
transform .25s ease,
box-shadow .25s ease;

}

.backBtn:hover{

transform:
translateY(-2px);

box-shadow:
0 14px 30px
rgba(0,0,0,.11);

}


/* ==========================================================
   HERO
========================================================== */

.hero{

background:white;

border-radius:28px;

padding:35px;

box-shadow:
0 18px 45px
rgba(0,0,0,.08);

text-align:center;

margin-bottom:40px;

width:100%;

}


.hero h1{

font-size:38px;

color:#1f3c88;

margin-bottom:18px;

line-height:1.4;

}


.hero p{

font-size:21px;

color:#555;

line-height:1.9;

margin-bottom:25px;

}


/* ==========================================================
   COIN BALANCE
========================================================== */

.balance{

display:inline-flex;

align-items:center;

justify-content:center;

gap:10px;

padding:
15px 26px;

border-radius:999px;

background:#fff8e6;

font-size:27px;

font-weight:bold;

color:#e09a00;

border:
2px solid #ffe08a;

}


.balance span{

color:#1f3c88;

}


/* ==========================================================
   SECTION TITLE
========================================================== */

.section-title{

font-size:34px;

color:#1f3c88;

margin-bottom:28px;

line-height:1.4;

}


/* ==========================================================
   WORD GRID
========================================================== */

.word-grid{

display:grid;

grid-template-columns:
repeat(
2,
minmax(0,1fr)
);

gap:26px;

width:100%;

}


/* ==========================================================
   WORD CARD
========================================================== */

.word-card{

background:white;

border-radius:28px;

padding:30px;

box-shadow:
0 16px 40px
rgba(0,0,0,.08);

position:relative;

overflow:hidden;

transition:
transform .28s ease,
box-shadow .28s ease;

width:100%;

}


.word-card:hover{

transform:
translateY(-5px);

box-shadow:
0 20px 45px
rgba(31,60,136,.11);

}


/* ==========================================================
   GOLD TOP LINE
========================================================== */

.word-card::before{

content:"";

position:absolute;

top:0;

left:0;

right:0;

height:8px;

background:
linear-gradient(
90deg,
#ffd86b,
#ffb300
);

}


/* ==========================================================
   WORD HEADER
========================================================== */

.word-header{

display:flex;

align-items:center;

gap:18px;

margin-bottom:22px;

}


.word-icon{

width:68px;

height:68px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

background:#fff8e6;

border:2px solid #ffe08a;

font-size:34px;

flex-shrink:0;

}


.word-title{

flex:1;

min-width:0;

}


.word-title h3{

font-size:25px;

color:#1f3c88;

margin-bottom:7px;

line-height:1.4;

}


.word-title p{

font-size:17px;

color:#888;

}


/* ==========================================================
   LOCKED CONTENT
========================================================== */

.locked-content{

background:#f8f9ff;

border:2px solid #e4e8ff;

border-radius:20px;

padding:25px;

text-align:center;

}


.lock-icon{

font-size:48px;

margin-bottom:12px;

}


.locked-content h4{

font-size:22px;

color:#1f3c88;

margin-bottom:10px;

line-height:1.5;

}


.locked-content p{

font-size:17px;

color:#777;

line-height:1.8;

margin-bottom:20px;

}


/* ==========================================================
   WORD PRICE
========================================================== */

.word-price{

display:inline-flex;

align-items:center;

justify-content:center;

gap:7px;

padding:10px 18px;

border-radius:999px;

background:#fff8e6;

border:2px solid #ffe08a;

color:#e09a00;

font-size:20px;

font-weight:bold;

margin-bottom:18px;

}


/* ==========================================================
   UNLOCK BUTTON
========================================================== */

.unlock-btn{

width:100%;

border:none;

padding:16px;

border-radius:18px;

background:
linear-gradient(
90deg,
#3768ff,
#6f43ff
);

color:white;

font-size:19px;

font-weight:bold;

cursor:pointer;

transition:
transform .25s ease,
box-shadow .25s ease,
opacity .25s ease;

box-shadow:
0 10px 25px
rgba(55,104,255,.25);

}


.unlock-btn:hover{

transform:
translateY(-3px);

box-shadow:
0 14px 30px
rgba(55,104,255,.30);

}


.unlock-btn:disabled{

opacity:.6;

cursor:not-allowed;

transform:none;

}


/* ==========================================================
   UNLOCKED CONTENT
========================================================== */

.unlocked-content{

display:none;

}


/* ==========================================================
   UNLOCKED STATE
========================================================== */

.word-card.unlocked
.unlocked-content{

display:block;

}


.word-card.unlocked
.locked-content{

display:none;

}


/* ==========================================================
   UNLOCKED BADGE
========================================================== */

.unlocked-badge{

display:inline-flex;

align-items:center;

gap:7px;

padding:9px 15px;

border-radius:999px;

background:#eef4ff;

border:2px solid #dce5ff;

color:#1f3c88;

font-size:16px;

font-weight:bold;

margin-bottom:18px;

}


/* ==========================================================
   VIDEO
========================================================== */

.word-video{

width:100%;

aspect-ratio:16/9;

border-radius:20px;

overflow:hidden;

background:#f5f7ff;

margin-bottom:15px;

}


.word-video video{

width:100%;

height:100%;

display:block;

object-fit:cover;

}


/* ==========================================================
   📝 بطاقات الكلمات التعليمية الجديدة
========================================================== */

.word-card-content{

background:
linear-gradient(
135deg,
#fbfcff,
#f5f3ff
);

border:
2px solid #e3e7ff;

border-radius:22px;

padding:23px;

}


/* ==========================================================
   مستوى الكلمة
========================================================== */

.word-level-badge{

display:inline-flex;

align-items:center;

justify-content:center;

gap:6px;

padding:8px 14px;

border-radius:999px;

background:#eef4ff;

border:2px solid #dce5ff;

color:#1f3c88;

font-size:15px;

font-weight:bold;

margin-bottom:18px;

}


/* ==========================================================
   الكلمة نفسها
========================================================== */

.word-learning-title{

direction:ltr;

text-align:center;

font-size:31px;

font-weight:900;

color:#1f3c88;

line-height:1.4;

margin-bottom:14px;

}


/* ==========================================================
   زر النطق
========================================================== */

.pronunciation-btn{

display:flex;

align-items:center;

justify-content:center;

gap:8px;

margin:
0 auto 22px;

border:none;

padding:12px 20px;

border-radius:15px;

background:white;

border:
2px solid #dce5ff;

color:#1f3c88;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.25s;

}


.pronunciation-btn:hover{

transform:
translateY(-2px);

box-shadow:
0 8px 20px
rgba(31,60,136,.10);

}


.pronunciation-btn:disabled{

opacity:.65;

cursor:not-allowed;

transform:none;

}


/* ==========================================================
   أقسام المعلومات
========================================================== */

.word-info-section{

background:white;

border:
1px solid #e4e8f5;

border-radius:17px;

padding:16px;

margin-bottom:13px;

}


.word-info-section:last-child{

margin-bottom:0;

}


.word-info-title{

font-size:16px;

font-weight:900;

color:#1f3c88;

margin-bottom:8px;

}


.word-info-text{

font-size:15px;

color:#555;

line-height:1.8;

}


/* ==========================================================
   التركيب / المرافق
========================================================== */

.word-collocation{

direction:ltr;

text-align:center;

font-size:21px;

font-weight:900;

color:#6546b8;

background:#f3efff;

border:
1px solid #ddd6ff;

border-radius:14px;

padding:12px;

margin-top:8px;

}


/* ==========================================================
   الأمثلة
========================================================== */

.word-examples-list{

display:flex;

flex-direction:column;

gap:10px;

}


.word-example-item{

background:#f8f9ff;

border:
1px solid #e4e8f5;

border-radius:14px;

padding:12px 14px;

}


.word-example-en{

direction:ltr;

text-align:left;

font-size:16px;

font-weight:bold;

color:#1f3c88;

line-height:1.6;

}


.word-example-ar{

font-size:14px;

color:#777;

margin-top:5px;

line-height:1.6;

}


/* ==========================================================
   بطاقة الكلمة التعليمية المغلقة
========================================================== */

.locked-word-type{

background:
linear-gradient(
135deg,
#f8f9ff,
#f5f2ff
);

border:
2px solid #e4e8ff;

border-radius:20px;

padding:23px;

text-align:center;

}


.locked-word-type .lock-icon{

margin-bottom:10px;

}


.locked-word-label{

font-size:21px;

font-weight:900;

color:#1f3c88;

margin-bottom:9px;

}


.locked-word-description{

font-size:15px;

color:#777;

line-height:1.7;

margin-bottom:16px;

}


/* ==========================================================
   TABLET
========================================================== */

@media(max-width:850px){

.word-grid{

grid-template-columns:
1fr;

}

}


/* ==========================================================

25px 15px 50px;

margin-bottom:28px;

font-size:18px;

font-size:30px;

.hero p{

font-size:18px;

font-size:23px;

margin-bottom:22px;

padding:25px;

/* ==========================================================
   SMALL MOBILE
========================================================== */

@media(max-width:400px){

.hero h1{

font-size:27px;

}


.hero p{

font-size:17px;

}


.balance{

font-size:21px;

}


.word-card{

padding:20px;

}


.word-title h3{

font-size:19px;

}


.word-icon{

width:55px;

height:55px;

font-size:27px;

}


.word-card-content{

padding:15px;

}


.word-learning-title{

font-size:24px;

}

}

</style>

</head>

// ==========================================================
// 🔊 تشغيل نطق الكلمة
// ==========================================================

function speakWord(text,button){

if(!("speechSynthesis" in window)){

alert(
"⚠️ المتصفح لا يدعم تشغيل النطق الصوتي."
);

return;

}

window.speechSynthesis.cancel();

const utterance =
new SpeechSynthesisUtterance(text);

utterance.lang =
"en-US";

utterance.rate =
.88;

utterance.pitch =
1;

button.disabled =
true;

const originalText =
button.innerHTML;

button.innerHTML =
"🔊 يتم النطق...";

utterance.onend =
()=>{

button.disabled =
false;

button.innerHTML =
originalText;

};

utterance.onerror =
()=>{

button.disabled =
false;

button.innerHTML =
originalText;

};

window.speechSynthesis.speak(
utterance
);

}

// ==========================================================
// 🔥 Firebase
// ==========================================================

import {

auth,
db

} from "./js/firebase.js";



import {

doc,
getDoc,
updateDoc,
arrayUnion,
increment

} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



import {

onAuthStateChanged

} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";



import {

playPurchaseSound,
unlockCoinSound,
refreshCoinBadge

} from "./js/reward.js";



// ==========================================================
// 🔓 تحميل الكلمات المملوكة
// ==========================================================

async function loadWordOwnership(user){


if(!user){

return;

}


try{


const userRef =

doc(
db,
"users",
user.uid
);


const snap =

await getDoc(
userRef
);


if(!snap.exists()){

return;

}


const data =
snap.data();


const ownedWords =
Array.isArray(data.ownedWords)
? data.ownedWords
: [];



words.forEach(word=>{


const card =

document.querySelector(

`.word-card[data-id="${word.id}"]`

);


if(!card){

return;

}


if(
ownedWords.includes(word.id)
){

card.classList.add(
"unlocked"
);

}


});


}

catch(error){

console.error(
"Error loading owned words:",
error
);

}

}



// ==========================================================
// 🪙 شراء كلمة
// ==========================================================

async function unlockWord(

word,
button

){


const user =
auth.currentUser;


if(!user){

alert(
"⚠️ يجب تسجيل الدخول أولًا."
);

return;

}


button.disabled =
true;


unlockCoinSound();



try{


const userRef =

doc(
db,
"users",
user.uid
);


const snap =

await getDoc(
userRef
);


if(!snap.exists()){


alert(
"⚠️ لم يتم العثور على حسابك."
);


button.disabled =
false;


return;

}


const data =
snap.data();


const coins =
Number(data.coins || 0);


const ownedWords =
Array.isArray(data.ownedWords)
? data.ownedWords
: [];



// ========================================================
// الكلمة مملوكة مسبقًا
// ========================================================

if(
ownedWords.includes(word.id)
){


const card =

document.querySelector(

`.word-card[data-id="${word.id}"]`

);


if(card){

card.classList.add(
"unlocked"
);

}


button.disabled =
false;


return;

}



// ========================================================
// الرصيد غير كافٍ
// ========================================================

if(
coins < word.price
){


alert(

`🪙 رصيدك غير كافٍ.

رصيدك الحالي: ${coins} كوينز

سعر الكلمة: ${word.price} كوينز`

);


button.disabled =
false;


return;

}



// ========================================================
// تأكيد الشراء
// ========================================================

const confirmed =

confirm(

`هل تريد فتح هذه الكلمة مقابل ${word.price} كوينز؟`

);


if(!confirmed){

button.disabled =
false;

return;

}



// ========================================================
// خصم العملات + حفظ الكلمة
// ========================================================

await updateDoc(

userRef,

{

coins:
increment(
-word.price
),

ownedWords:
arrayUnion(
word.id
)

}

);



// ========================================================
// صوت نجاح الشراء
// ========================================================

playPurchaseSound();



// ========================================================
// فتح البطاقة
// ========================================================

const card =

document.querySelector(

`.word-card[data-id="${word.id}"]`

);


if(card){

card.classList.add(
"unlocked"
);

}



// ========================================================
// تحديث الرصيد
// ========================================================

const newBalance =
coins - word.price;


const balance =

document.getElementById(
"coinBalance"
);


if(balance){

balance.textContent =
newBalance;

}


refreshCoinBadge(
newBalance
);


}

catch(error){


console.error(
"Word purchase error:",
error
);


alert(

"⚠️ حدث خطأ أثناء فتح الكلمة. حاول مرة أخرى."

);


}


button.disabled =
false;

}



// ==========================================================
// 🔘 ربط أزرار فتح الكلمات
// ==========================================================

document
.querySelectorAll(".word-card")
.forEach(card=>{


const wordId =
card.dataset.id;


const word =

words.find(

item =>
item.id === wordId

);


const button =

card.querySelector(
".unlock-btn"
);


if(
!word ||
!button
){

return;

}


button.addEventListener(

"click",

function(){

unlockWord(
word,
button
);

}

);

});



// ==========================================================
// 🔐 التحقق من تسجيل الدخول
// ==========================================================

onAuthStateChanged(

auth,

async function(user){


if(!user){

window.location.href =
"login.html";

return;

}



try{


const userRef =

doc(
db,
"users",
user.uid
);


const snap =

await getDoc(
userRef
);


if(!snap.exists()){

console.warn(
"User document does not exist."
);

return;

}


const data =
snap.data();


const coins =
Number(data.coins || 0);



/* -----------------------------------------------
   عرض الرصيد
------------------------------------------------ */

const balance =

document.getElementById(
"coinBalance"
);


if(balance){

balance.textContent =
coins;

}


/* -----------------------------------------------
   تحديث العداد العام
------------------------------------------------ */

refreshCoinBadge(
coins
);


/* -----------------------------------------------
   تحميل الكلمات المملوكة
------------------------------------------------ */

await loadWordOwnership(
user
);


}

catch(error){

console.error(
"Word bank initialization error:",
error
);

}

});


</script>
