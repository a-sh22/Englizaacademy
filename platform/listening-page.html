<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Listening | Engliza Academy</title>

<style>

/* =========================================================
   ENGLIZA LISTENING
   Beginner Listening Page
   ========================================================= */

:root{
    --blue:#3157D5;
    --blue-dark:#233E9B;
    --purple:#7654D9;
    --purple-light:#EEEAFE;
    --gold:#D9A441;
    --gold-light:#FFF6DF;

    --text:#17213C;
    --muted:#6E7891;
    --white:#FFFFFF;
    --bg:#F7F8FC;
    --border:#E8EAF2;

    --success:#2E9B68;
    --danger:#D95D67;

    --shadow:0 12px 35px rgba(36,48,94,.08);
    --shadow-hover:0 18px 45px rgba(36,48,94,.13);

    --radius-xl:28px;
    --radius-lg:22px;
    --radius-md:17px;
}


/* =========================
   RESET
   ========================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
}

button,
a{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
}




/* =========================
   TOP BAR
========================= */

.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  direction:ltr;
  min-height:76px;
  margin-bottom:26px;
}


/* =========================
   EIRLO
========================= */

.mascot-circle{
  width:76px;
  height:76px;

  flex:0 0 76px;

  border-radius:50%;
  overflow:hidden;

  background:#fff;
  border:3px solid #fff;

  box-shadow:
    0 8px 24px rgba(36,48,94,.12);

  display:flex;
  align-items:center;
  justify-content:center;
}

.top-mascot{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transform:scale(1.08);
}

/* =========================
   BACK BUTTON
========================= */

.top-back-btn{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  direction:rtl;

  min-width:108px;
  height:58px;

  padding:0 18px;

  background:#fff;
  color:var(--blue-dark);

  border:0;
  border-radius:17px;

  font-size:16px;
  font-weight:800;

  text-decoration:none;

  box-shadow:
    0 8px 25px rgba(36,48,94,.09);

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.top-back-btn:hover{
  transform:translateY(-2px);

  box-shadow:
    0 12px 30px rgba(36,48,94,.13);
}

.top-back-btn:active{
  transform:translateY(0);
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  .top-bar{
    min-height:68px;
    margin-bottom:20px;
  }

  .mascot-circle{
    width:68px;
    height:68px;
    flex-basis:68px;
  }

  .top-mascot{
    width:100%;
    height:100%;
    transform:none;
  }

  .top-back-btn{
    min-width:96px;
    height:54px;
    padding:0 15px;
    border-radius:16px;
    font-size:15px;
  }

}


   
   
/* =========================
   PAGE
   ========================= */

.page{
    width:min(1180px, calc(100% - 32px));
    margin:0 auto;
    padding:28px 0 70px;
}


/* =========================
   HERO
   ========================= */

.hero{
    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 88% 15%,
            rgba(255,255,255,.18),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #3157D5 0%,
            #7654D9 100%
        );

    color:white;
    border-radius:32px;

    padding:38px 34px;
    margin-bottom:28px;

    box-shadow:
        0 18px 45px rgba(49,87,213,.20);
}

.hero::after{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius:50%;

    left:-55px;
    bottom:-80px;
}

.hero-content{
    position:relative;
    z-index:2;

    max-width:760px;
}

.brand-small{
    display:inline-flex;
    align-items:center;

    gap:8px;

    font-size:13px;
    font-weight:700;

    opacity:.9;

    margin-bottom:14px;
}

.brand-dot{
    width:8px;
    height:8px;

    background:#F3C86B;

    border-radius:50%;
}

.hero h1{
    margin:0 0 12px;

    font-size:
        clamp(30px,5vw,48px);

    line-height:1.1;

    letter-spacing:-1px;
}

.hero p{
    margin:0;

    font-size:16px;
    line-height:1.9;

    opacity:.93;

    max-width:680px;
}


/* =========================
   PATH INFO
   ========================= */

.path-info{
    background:white;

    border:
        1px solid
        var(--border);

    border-radius:var(--radius-lg);

    padding:20px 22px;

    margin-bottom:42px;

    box-shadow:var(--shadow);
}

.path-top{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:15px;

    margin-bottom:13px;
}

.path-title{
    font-weight:800;
    font-size:16px;
}

.path-level{
    color:var(--blue);

    background:#EEF2FF;

    border-radius:999px;

    padding:7px 13px;

    font-size:12px;
    font-weight:800;
}

.progress-track{
    height:9px;

    background:#ECEEF5;

    border-radius:999px;

    overflow:hidden;
}

.progress-bar{
    height:100%;

    width:8%;

    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--purple)
        );

    border-radius:999px;
}


/* =========================================================
   STAGES
   ========================================================= */

.stage{
    margin-bottom:64px;
}


/* =========================
   STAGE HEADER CARD
   ========================= */

.stage-header-card{

    background:white;

    border:
        1px solid
        var(--border);

    border-radius:var(--radius-xl);

    padding:22px 24px;

    margin-bottom:22px;

    box-shadow:var(--shadow);

    position:relative;

    overflow:hidden;
}

.stage-header-card::before{

    content:"";

    position:absolute;

    top:0;
    right:0;

    width:7px;
    height:100%;

    background:
        linear-gradient(
            180deg,
            var(--blue),
            var(--purple)
        );
}

.stage-header-inner{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;
}

.stage-number-box{

    flex-shrink:0;

    width:58px;
    height:58px;

    display:grid;
    place-items:center;

    border-radius:17px;

    background:
        linear-gradient(
            135deg,
            #EEF2FF,
            #EEEAFE
        );

    color:var(--purple);

    font-size:15px;
    font-weight:900;
}

.stage-number-box span{

    display:block;

    font-size:10px;

    color:var(--muted);

    margin-bottom:2px;
}

.stage-text{

    flex:1;
}

.stage-number{

    color:var(--gold);

    font-size:11px;

    font-weight:900;

    letter-spacing:.8px;

    margin-bottom:5px;
}

.stage-title{

    margin:0;

    font-size:23px;

    font-weight:850;

    line-height:1.4;
}

.stage-description{

    margin:6px 0 0;

    color:var(--muted);

    line-height:1.8;

    font-size:13px;

    max-width:780px;
}


/* =========================
   LESSON GRID
   ========================= */

.lesson-grid{

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:18px;
}


/* =========================
   LESSON CARD
   ========================= */

.lesson-card{

    background:white;

    border:
        1px solid
        var(--border);

    border-radius:var(--radius-xl);

    padding:22px;

    box-shadow:var(--shadow);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;

    display:flex;

    flex-direction:column;

    min-height:285px;
}

.lesson-card:hover{

    transform:translateY(-4px);

    box-shadow:var(--shadow-hover);

    border-color:#D9DDF0;
}

.lesson-number{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:17px;
}

.lesson-index{

    width:38px;
    height:38px;

    display:grid;
    place-items:center;

    border-radius:12px;

    background:var(--purple-light);

    color:var(--purple);

    font-size:13px;

    font-weight:900;
}

.lesson-level{

    font-size:11px;

    font-weight:800;

    color:var(--muted);

    background:#F4F5F9;

    border-radius:999px;

    padding:6px 10px;
}

.lesson-card h3{

    margin:0 0 9px;

    font-size:19px;

    line-height:1.45;
}

.lesson-topic{

    color:var(--muted);

    font-size:13px;

    line-height:1.7;

    margin:0 0 18px;
}

.lesson-meta{

    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-top:auto;

    margin-bottom:17px;
}

.meta-chip{

    font-size:11px;

    color:#5B6480;

    background:#F6F7FA;

    border-radius:999px;

    padding:6px 9px;
}

.start-btn{

    width:100%;

    border:0;

    border-radius:14px;

    padding:12px 15px;

    color:white;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--purple)
        );

    font-weight:800;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.start-btn:hover{

    transform:translateY(-1px);
}

.start-btn:active{

    transform:translateY(0);
}


/* =========================
   LESSON VIEW
   ========================= */

.lesson-view{

    display:none;

    background:white;

    border:
        1px solid
        var(--border);

    border-radius:30px;

    box-shadow:var(--shadow);

    overflow:hidden;

    margin-top:10px;
}

.lesson-view.active{

    display:block;

    animation:
        lessonIn .25s ease;
}

@keyframes lessonIn{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================
   LESSON HEADER
   ========================= */

.lesson-view-header{

    background:
        radial-gradient(
            circle at 90% 20%,
            rgba(255,255,255,.16),
            transparent 27%
        ),
        linear-gradient(
            135deg,
            #3157D5,
            #7654D9
        );

    color:white;

    padding:30px;
}

.lesson-view-header-top{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:20px;
}

.back-btn{

    border:
        1px solid
        rgba(255,255,255,.28);

    background:
        rgba(255,255,255,.10);

    color:white;

    border-radius:12px;

    padding:9px 13px;

    font-weight:700;
}

.back-btn:hover{

    background:
        rgba(255,255,255,.16);
}

.lesson-view-number{

    font-size:12px;

    font-weight:800;

    opacity:.82;

    margin-bottom:7px;
}

.lesson-view h2{

    margin:0;

    font-size:
        clamp(25px,4vw,36px);

    line-height:1.3;
}

.lesson-view-subtitle{

    margin:10px 0 0;

    opacity:.9;

    line-height:1.8;

    font-size:14px;
}


/* =========================
   LESSON BODY
   ========================= */

.lesson-body{

    padding:28px;
}


/* =========================
   CONTENT SECTIONS
   ========================= */

.content-section{

    padding:24px 0;

    border-bottom:
        1px solid
        var(--border);
}

.content-section:first-child{

    padding-top:0;
}

.content-section:last-child{

    border-bottom:0;
}

.section-label{

    display:flex;

    align-items:center;

    gap:9px;

    margin-bottom:14px;
}

.section-icon{

    width:35px;
    height:35px;

    display:grid;

    place-items:center;

    border-radius:11px;

    background:var(--purple-light);

    font-size:17px;
}

.section-label h3{

    margin:0;

    font-size:18px;
}

.instruction{

    background:#F7F8FC;

    border-right:
        4px solid
        var(--blue);

    border-radius:13px;

    padding:14px 16px;

    line-height:1.9;

    font-size:14px;

    color:#46506B;

    margin-bottom:17px;
}


/* =========================
   SOURCE CARD
   ========================= */

.source-card{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:16px;

    background:
        linear-gradient(
            135deg,
            #F7F8FF,
            #F2EEFF
        );

    border:
        1px solid
        #E4E0F8;

    border-radius:20px;

    padding:18px;
}

.source-info{

    min-width:0;
}

.source-name{

    font-weight:900;

    margin-bottom:4px;
}

.source-description{

    font-size:12px;

    color:var(--muted);

    line-height:1.6;
}

.source-btn{

    flex-shrink:0;

    background:white;

    color:var(--blue);

    border:
        1px solid
        #DCE1F4;

    border-radius:12px;

    padding:10px 14px;

    font-weight:800;
}


/* =========================
   WORDS
   ========================= */

.words-grid{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;
}

.word-card{

    border:
        1px solid
        var(--border);

    border-radius:15px;

    padding:13px 15px;

    background:white;
}

.word{

    font-weight:900;

    direction:ltr;

    text-align:left;

    margin-bottom:5px;
}

.word-note{

    color:var(--muted);

    font-size:12px;

    line-height:1.7;
}


/* =========================
   PRACTICE
   ========================= */

.practice-box{

    background:#FBFAFF;

    border:
        1px solid
        #E7E1FA;

    border-radius:20px;

    padding:20px;
}

.practice-title{

    display:flex;

    align-items:center;

    gap:8px;

    font-weight:900;

    margin-bottom:14px;
}

.practice-text{

    background:white;

    border-radius:15px;

    padding:18px;

    direction:ltr;

    text-align:left;

    line-height:2;

    font-size:15px;

    border:
        1px solid
        #ECEAF5;

    white-space:pre-line;
}

.practice-note{

    margin-top:12px;

    color:var(--muted);

    font-size:12px;

    line-height:1.8;
}


/* =========================
   TIP
   ========================= */

.tip-box{

    background:var(--gold-light);

    border:
        1px solid
        #F1DFB2;

    border-radius:17px;

    padding:16px;

    color:#695526;

    line-height:1.9;

    font-size:13px;
}


/* =========================
   FINAL TASK
   ========================= */

.final-task{

    background:
        linear-gradient(
            135deg,
            #F0F4FF,
            #F6F1FF
        );

    border:
        1px solid
        #DEE4FA;

    border-radius:20px;

    padding:20px;
}

.final-task h4{

    margin:0 0 8px;

    font-size:16px;
}

.final-task p{

    margin:0;

    line-height:1.9;

    color:#4B5570;

    font-size:14px;
}


/* =========================
   NAVIGATION
   ========================= */

.lesson-navigation{

    display:flex;

    justify-content:space-between;

    gap:12px;

    padding-top:22px;

    margin-top:20px;

    border-top:
        1px solid
        var(--border);
}

.nav-lesson-btn{

    border:
        1px solid
        var(--border);

    background:white;

    color:var(--text);

    border-radius:13px;

    padding:11px 14px;

    font-weight:800;
}

.nav-lesson-btn.primary{

    background:var(--blue);

    color:white;

    border-color:var(--blue);
}

.nav-lesson-btn:disabled{

    opacity:.4;

    cursor:not-allowed;
}


/* =========================
   FOOTER
   ========================= */

.footer-note{

    text-align:center;

    color:var(--muted);

    font-size:12px;

    line-height:1.8;

    margin-top:35px;
}


/* =========================
   RESPONSIVE
   ========================= */

@media(max-width:900px){

    .lesson-grid{

        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

}


@media(max-width:650px){

    .page{

        width:
            min(
                100% - 20px,
                1180px
            );

        padding-top:12px;
    }

    .hero{

        padding:27px 22px;

        border-radius:25px;
    }

    .hero h1{

        font-size:31px;
    }

    .path-info{

        margin-bottom:32px;
    }

    .stage{

        margin-bottom:48px;
    }

    .stage-header-card{

        padding:19px 20px;

        margin-bottom:17px;

        border-radius:22px;
    }

    .stage-header-inner{

        align-items:flex-start;
    }

    .stage-number-box{

        width:50px;
        height:50px;

        border-radius:14px;
    }

    .stage-title{

        font-size:20px;
    }

    .stage-description{

        font-size:12px;

        line-height:1.8;
    }

    .lesson-grid{

        grid-template-columns:1fr;
    }

    .lesson-view-header{

        padding:23px 19px;
    }

    .lesson-view-header-top{

        flex-direction:column-reverse;
    }

    .lesson-body{

        padding:20px;
    }

    .source-card{

        align-items:flex-start;

        flex-direction:column;
    }

    .source-btn{

        width:100%;

        text-align:center;
    }

    .words-grid{

        grid-template-columns:1fr;
    }

    .lesson-navigation{

        flex-direction:column;
    }

    .nav-lesson-btn{

        width:100%;
    }
}


/* =========================
   ENGLIZA AUDIO + TRANSCRIPT + VOCABULARY
   ========================= */
.audio-player-card{
    background:linear-gradient(135deg,#F7F8FF,#F2EEFF);
    border:1px solid #E4E0F8;
    border-radius:20px;
    padding:20px;
}
.audio-player-card audio{display:block;width:100%;margin:12px 0 4px;}
.audio-player-title{font-weight:900;margin-bottom:5px;color:var(--text);}
.audio-player-help{font-size:12px;color:var(--muted);line-height:1.8;}
.transcript-box{
    direction:ltr;text-align:left;white-space:pre-line;
    background:#fff;border:1px solid var(--border);border-radius:18px;
    padding:20px;line-height:2.05;font-size:16px;color:var(--text);
}
.transcript-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px;}
.transcript-action-btn,.word-speak-btn{
    border:1px solid #DCE1F4;background:#fff;color:var(--blue-dark);
    border-radius:11px;padding:9px 12px;font-weight:800;font-size:12px;
}
.word-card{display:flex;flex-direction:column;gap:7px;}
.word-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.word-examples{direction:ltr;text-align:left;font-size:12px;line-height:1.8;color:#46506B;margin-top:4px;}
.word-example{padding-top:5px;}
.word-example-ar{direction:rtl;text-align:right;color:var(--muted);font-size:11px;margin-top:1px;}
@media(max-width:650px){.transcript-box{font-size:15px;padding:16px}.audio-player-card{padding:15px}.word-top{align-items:flex-start}}

</style>
</head>


<body>


<div class="page">




<!-- =====================================================
     TOP BAR
     ===================================================== -->

<div class="top-bar">

    <!-- إيرلو — الجهة اليسرى -->
    <div class="mascot-circle">

        <img
            class="top-mascot"
            src="../okay.owl.PNG"
            alt="Eirlo">

    </div>


    <!-- الرجوع — الجهة اليمنى -->
    <a
        class="top-back-btn"
        href="skills-practice.html">

        رجوع ↩️

    </a>

</div>
   
   

<!-- =====================================================
     HERO
     ===================================================== -->

<section class="hero">

    <div class="hero-content">

        <div class="brand-small">

            <span class="brand-dot"></span>

            ENGLIZA ACADEMY

        </div>

        <h1>🎧 الاستماع</h1>

        <p>
            درّب أذنك على الإنجليزية خطوة بخطوة.
            ابدأ من المقاطع البسيطة، ثم انتقل تدريجيًا
            إلى استماع أطول وأكثر طبيعية.
        </p>

    </div>

</section>


<!-- =====================================================
     PATH INFO
     ===================================================== -->

<section class="path-info">

    <div class="path-top">

        <div class="path-title">
            المستوى المبتدئ
        </div>

        <div class="path-level">
            Beginner
        </div>

    </div>

    <div class="progress-track">

        <div class="progress-bar"></div>

    </div>

</section>


<!-- =====================================================
     LESSONS
     ===================================================== -->

<main id="lessonsContainer"></main>


<!-- =====================================================
     LESSON VIEW
     ===================================================== -->

<section
    id="lessonView"
    class="lesson-view"
    aria-live="polite">
</section>


<div class="footer-note">

    الاستماع مهارة تحتاج إلى ممارسة مستمرة.
    لا تحاول فهم كل كلمة من أول مرة؛

/* =========================================================
   RENDER LESSON CARDS
   ========================================================= */

const lessonsContainer =
    document.getElementById("lessonsContainer");

const lessonView =
    document.getElementById("lessonView");


function groupLessonsByStage(){

    const groups = {};

    lessons.forEach(lesson => {

        if(!groups[lesson.stage]){

            groups[lesson.stage] = {

                title:lesson.stageTitle,

                description:
                    lesson.stageDescription,

                lessons:[]
            };
        }

        groups[lesson.stage].lessons.push(lesson);

    });

    return groups;
}


/* =========================================================
   RENDER
   ========================================================= */

function renderLessonCards(){

    const groups =
        groupLessonsByStage();

    lessonsContainer.innerHTML = "";

    Object.keys(groups).forEach(stageNumber => {

        const group =
            groups[stageNumber];

        const section =
            document.createElement("section");

        section.className = "stage";

        section.innerHTML = `

            <div class="stage-header-card">

                <div class="stage-header-inner">

                    <div class="stage-number-box">

                        ${String(stageNumber).padStart(2,"0")}

                    </div>


                    <div class="stage-text">

                        <div class="stage-number">

                        </div>

                        <h2 class="stage-title">
                            ${escapeHTML(group.title)}

                        <p class="stage-description">
                            ${escapeHTML(group.description)}
                        </p>

                </div>

            </div>


            <div class="lesson-grid">

                ${group.lessons.map(lesson => {

                    return `

function closeLesson(){

    lessonView.classList.remove("active");


    setTimeout(() => {

        lessonView.innerHTML = "";

    },200);


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =========================================================
   PRONUNCIATION + TRANSCRIPT HELPERS
   ========================================================= */
function speakWordForLesson(lessonId, wordIndex){
    const lesson = lessons.find(item => item.id === Number(lessonId));
    if(!lesson || !lesson.words || !lesson.words[wordIndex]) return;
    speakWord(lesson.words[wordIndex].word);
}
function speakLessonTranscript(lessonId){
    const lesson = lessons.find(item => item.id === Number(lessonId));
    if(lesson) speakText(lesson.transcript || '');
}
function copyLessonTranscript(lessonId){
    const lesson = lessons.find(item => item.id === Number(lessonId));
    if(lesson) copyTranscript(lesson.transcript || '');
}

function speakWord(word){
    if(!('speechSynthesis' in window)){
        alert('ميزة النطق غير مدعومة في هذا المتصفح.');
        return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(String(word));
    utterance.lang = 'en-US';
    utterance.rate = 0.82;
    window.speechSynthesis.speak(utterance);
}

function speakText(text){
    if(!('speechSynthesis' in window)){
        alert('ميزة النطق غير مدعومة في هذا المتصفح.');
        return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(String(text));
    utterance.lang = 'en-US';
    utterance.rate = 0.88;
    window.speechSynthesis.speak(utterance);
}

function copyTranscript(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(String(text)).then(() => alert('تم نسخ النص.')).catch(() => fallbackCopyTranscript(text));
    } else {
        fallbackCopyTranscript(text);
    }
}
function fallbackCopyTranscript(text){
    const field = document.createElement('textarea');
    field.value = String(text);
    field.style.position = 'fixed';
    field.style.opacity = '0';
    document.body.appendChild(field);
    field.select();
    try { document.execCommand('copy'); alert('تم نسخ النص.'); }
    catch(error) { alert('تعذر النسخ تلقائيًا. يمكنك تحديد النص ونسخه يدويًا.'); }
    field.remove();
}

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");
}
