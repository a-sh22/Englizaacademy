<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Listening | Engliza Academy</title>


<style>

/* =========================================================
   ENGLIZA LISTENING
   ========================================================= */

:root{

    --blue:#3157D5;
    --blue-dark:#233E9B;
    --purple:#7654D9;
    --purple-light:#EEEAFE;

    --gold:#D9A441;
    --gold-light:#FFF6DF;

    --text:#17213C;
    --muted:#6E7891;

    --white:#FFFFFF;
    --bg:#F7F8FC;
    --border:#E8EAF2;

    --shadow:
        0 12px 35px rgba(36,48,94,.08);

    --shadow-hover:
        0 18px 45px rgba(36,48,94,.13);

    --radius-xl:28px;
    --radius-lg:22px;
    --radius-md:17px;
}


/* =========================================================
   RESET
   ========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    background:var(--bg);

    color:var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
}

button,
a{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
}


/* =========================================================
   PAGE
   ========================================================= */

.page{

    width:min(
        1180px,
        calc(100% - 32px)
    );

    margin:0 auto;

    padding:28px 0 70px;
}


/* =========================================================
   HERO
   ========================================================= */

.hero{

    position:relative;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 88% 15%,
            rgba(255,255,255,.18),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #3157D5 0%,
            #7654D9 100%
        );

    color:white;

    border-radius:32px;

    padding:38px 34px;

    margin-bottom:28px;

    box-shadow:
        0 18px 45px rgba(49,87,213,.20);
}

.hero::after{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius:50%;

    left:-55px;
    bottom:-80px;
}

.hero-content{

    position:relative;

    z-index:2;

    max-width:760px;
}

.brand-small{

    display:inline-flex;

    align-items:center;

    gap:8px;

    font-size:13px;

    font-weight:700;

    opacity:.9;

    margin-bottom:14px;
}

.brand-dot{

    width:8px;
    height:8px;

    background:#F3C86B;

    border-radius:50%;
}

.hero h1{

    margin:0 0 12px;

    font-size:
        clamp(30px,5vw,48px);

    line-height:1.1;

    letter-spacing:-1px;
}

.hero p{

    margin:0;

    font-size:16px;

    line-height:1.9;

    opacity:.93;

    max-width:680px;
}


/* =========================================================
   PATH INFO
   ========================================================= */

.path-info{

    background:white;

    border:
        1px solid
        var(--border);

    border-radius:
        var(--radius-lg);

    padding:20px 22px;

    margin-bottom:28px;

    box-shadow:var(--shadow);
}

.path-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:13px;
}

.path-title{

    font-weight:800;

    font-size:16px;
}

.path-level{

    color:var(--blue);

    background:#EEF2FF;

    border-radius:999px;

    padding:7px 13px;

    font-size:12px;

    font-weight:800;
}

.progress-track{

    height:9px;

    background:#ECEEF5;

    border-radius:999px;

    overflow:hidden;
}

.progress-bar{

    height:100%;

    width:100%;

    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--purple)
        );

    border-radius:999px;
}


/* =========================================================
   STAGE
   ========================================================= */

.stage{

    margin-bottom:34px;
}

.stage-header{

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:20px;

    margin-bottom:15px;
}

.stage-number{

    color:var(--gold);

    font-size:12px;

    font-weight:900;

    letter-spacing:.8px;

    margin-bottom:5px;
}

.stage-title{

    margin:0;

    font-size:24px;

    font-weight:850;
}

.stage-description{

    margin:5px 0 0;

    color:var(--muted);

    line-height:1.7;

    font-size:14px;
}


/* =========================================================
   LESSON GRID
   ========================================================= */

.lesson-grid{

    display:grid;

    grid-template-columns:
        repeat(
            3,
            minmax(0,1fr)
        );

    gap:18px;
}

.lesson-card{

    background:white;

    border:
        1px solid
        var(--border);

    border-radius:
        var(--radius-xl);

    padding:22px;

    box-shadow:var(--shadow);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;

    display:flex;

    flex-direction:column;

    min-height:285px;
}

.lesson-card:hover{

    transform:
        translateY(-4px);

    box-shadow:
        var(--shadow-hover);

    border-color:#D9DDF0;
}

.lesson-number{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:17px;
}

.lesson-index{

    width:38px;
    height:38px;

    display:grid;

    place-items:center;

    border-radius:12px;

    background:
        var(--purple-light);

    color:
        var(--purple);

    font-size:13px;

    font-weight:900;
}

.lesson-level{

    font-size:11px;

    font-weight:800;

    color:var(--muted);

    background:#F4F5F9;

    border-radius:999px;

    padding:6px 10px;
}

.lesson-card h3{

    margin:0 0 9px;

    font-size:19px;

    line-height:1.45;
}

.lesson-topic{

    color:var(--muted);

    font-size:13px;

    line-height:1.7;

    margin:0 0 18px;
}

.lesson-meta{

    display:flex;

    flex-wrap:wrap;

    gap:7px;

    margin-top:auto;

    margin-bottom:17px;
}

.meta-chip{

    font-size:11px;

    color:#5B6480;

    background:#F6F7FA;

    border-radius:999px;

    padding:6px 9px;
}

.start-btn{

    width:100%;

    border:0;

    border-radius:14px;

    padding:12px 15px;

    color:white;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--purple)
        );

    font-weight:800;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.start-btn:hover{

    transform:
        translateY(-1px);
}

.start-btn:active{

    transform:
        translateY(0);
}


/* =========================================================
   LESSON VIEW
   ========================================================= */

.lesson-view{

    display:none;

    background:white;

    border:
        1px solid
        var(--border);

    border-radius:30px;

    box-shadow:var(--shadow);

    overflow:hidden;

    margin-top:10px;
}

.lesson-view.active{

    display:block;

    animation:
        lessonIn .25s ease;
}

@keyframes lessonIn{

    from{

        opacity:0;

        transform:
            translateY(8px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}

.lesson-view-header{

    background:
        radial-gradient(
            circle at 90% 20%,
            rgba(255,255,255,.16),
            transparent 27%
        ),
        linear-gradient(
            135deg,
            #3157D5,
            #7654D9
        );

    color:white;

    padding:30px;
}

.lesson-view-header-top{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:20px;
}

.back-btn{

    border:
        1px solid
        rgba(255,255,255,.28);

    background:
        rgba(255,255,255,.10);

    color:white;

    border-radius:12px;

    padding:9px 13px;

    font-weight:700;
}

.back-btn:hover{

    background:
        rgba(255,255,255,.16);
}

.lesson-view-number{

    font-size:12px;

    font-weight:800;

    opacity:.82;

    margin-bottom:7px;
}

.lesson-view h2{

    margin:0;

    font-size:
        clamp(25px,4vw,36px);

    line-height:1.3;
}

.lesson-view-subtitle{

    margin:10px 0 0;

    opacity:.9;

    line-height:1.8;

    font-size:14px;
}

.lesson-body{

    padding:28px;
}


/* =========================================================
   CONTENT SECTIONS
   ========================================================= */

.content-section{

    padding:24px 0;

    border-bottom:
        1px solid
        var(--border);
}

.content-section:last-child{

    border-bottom:0;
}

.section-label{

    display:flex;

    align-items:center;

    gap:9px;

    margin-bottom:14px;
}

.section-icon{

    width:35px;
    height:35px;

    display:grid;

    place-items:center;

    border-radius:11px;

    background:
        var(--purple-light);

    font-size:17px;
}

.section-label h3{

    margin:0;

    font-size:18px;
}

.instruction{

    background:#F7F8FC;

    border-right:
        4px solid
        var(--blue);

    border-radius:13px;

    padding:14px 16px;

    line-height:1.9;

    font-size:14px;

    color:#46506B;

    margin-bottom:17px;
}


/* =========================================================
   SOURCE CARD
   ========================================================= */

.source-card{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:16px;

    background:
        linear-gradient(
            135deg,
            #F7F8FF,
            #F2EEFF
        );

    border:
        1px solid
        #E4E0F8;

    border-radius:20px;

    padding:18px;
}

.source-info{

    min-width:0;
}

.source-name{

    font-weight:900;

    margin-bottom:4px;
}

.source-description{

    font-size:12px;

    color:var(--muted);

    line-height:1.6;
}

.source-btn{

    flex-shrink:0;

    background:white;

    color:var(--blue);

    border:
        1px solid
        #DCE1F4;

    border-radius:12px;

    padding:10px 14px;

    font-weight:800;
}


/* =========================================================
   WORDS
   ========================================================= */

.words-grid{

    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:10px;
}

.word-card{

    border:
        1px solid
        var(--border);

    border-radius:15px;

    padding:13px 15px;

    background:white;
}

.word{

    font-weight:900;

    direction:ltr;

    text-align:left;

    margin-bottom:5px;
}

.word-note{

    color:var(--muted);

    font-size:12px;

    line-height:1.7;
}


/* =========================================================
   PRACTICE
   ========================================================= */

.practice-box{

    background:#FBFAFF;

    border:
        1px solid
        #E7E1FA;

    border-radius:20px;

    padding:20px;
}

.practice-title{

    display:flex;

    align-items:center;

    gap:8px;

    font-weight:900;

    margin-bottom:14px;
}

.practice-text{

    background:white;

    border-radius:15px;

    padding:18px;

    direction:ltr;

    text-align:left;

    line-height:2;

    font-size:15px;

    border:
        1px solid
        #ECEAF5;

    white-space:pre-line;
}

.practice-note{

    margin-top:12px;

    color:var(--muted);

    font-size:12px;

    line-height:1.8;
}


/* =========================================================
   TIP
   ========================================================= */

.tip-box{

    background:
        var(--gold-light);

    border:
        1px solid
        #F1DFB2;

    border-radius:17px;

    padding:16px;

    color:#695526;

    line-height:1.9;

    font-size:13px;
}


/* =========================================================
   FINAL TASK
   ========================================================= */

.final-task{

    background:
        linear-gradient(
            135deg,
            #F0F4FF,
            #F6F1FF
        );

    border:
        1px solid
        #DEE4FA;

    border-radius:20px;

    padding:20px;
}

.final-task h4{

    margin:0 0 8px;

    font-size:16px;
}

.final-task p{

    margin:0;

    line-height:1.9;

    color:#4B5570;

    font-size:14px;
}


/* =========================================================
   NAVIGATION
   ========================================================= */

.lesson-navigation{

    display:flex;

    justify-content:space-between;

    gap:12px;

    padding-top:22px;

    margin-top:20px;

    border-top:
        1px solid
        var(--border);
}

.nav-lesson-btn{

    border:
        1px solid
        var(--border);

    background:white;

    color:var(--text);

    border-radius:13px;

    padding:11px 14px;

    font-weight:800;
}

.nav-lesson-btn.primary{

    background:
        var(--blue);

    color:white;

    border-color:
        var(--blue);
}

.nav-lesson-btn:disabled{

    opacity:.4;

    cursor:not-allowed;
}


/* =========================================================
   FOOTER
   ========================================================= */

.footer-note{

    text-align:center;

    color:var(--muted);

    font-size:12px;

    line-height:1.8;

    margin-top:35px;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:900px){

    .lesson-grid{

        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );
    }
}


@media(max-width:650px){

    .page{

        width:
            min(
                100% - 20px,
                1180px
            );

        padding-top:12px;
    }

    .hero{

        padding:27px 22px;

        border-radius:25px;
    }

    .hero h1{

        font-size:31px;
    }

    .lesson-grid{

        grid-template-columns:1fr;
    }

    .stage-title{

        font-size:21px;
    }

    .lesson-view-header{

        padding:23px 19px;
    }

    .lesson-view-header-top{

        flex-direction:column-reverse;
    }

    .lesson-body{

        padding:20px;
    }

    .source-card{

        align-items:flex-start;

        flex-direction:column;
    }

    .source-btn{

        width:100%;

        text-align:center;
    }

    .words-grid{

        grid-template-columns:1fr;
    }

    .lesson-navigation{

        flex-direction:column;
    }

    .nav-lesson-btn{

        width:100%;
    }
}

</style>

</head>

/* =========================================================
   ELEMENTS
   ========================================================= */

const lessonsContainer =
    document.getElementById("lessonsContainer");

const lessonView =
    document.getElementById("lessonView");



/* =========================================================
   GROUP LESSONS
   ========================================================= */

function groupLessonsByStage(){

    const groups = {};

    lessons.forEach(lesson => {

        if(!groups[lesson.stage]){

            groups[lesson.stage] = {

                title:
                    lesson.stageTitle,

                description:
                    lesson.stageDescription,

                lessons:[]
            };
        }

        groups[lesson.stage].lessons.push(lesson);

    });

    return groups;
}



/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");
}



/* =========================================================
   RENDER LESSON CARDS
   ========================================================= */

function renderLessonCards(){

    const groups =
        groupLessonsByStage();

    lessonsContainer.innerHTML = "";


    Object.keys(groups).forEach(stageNumber => {

        const group =
            groups[stageNumber];


        const section =
            document.createElement("section");


        section.className =
            "stage";


        section.innerHTML = `

            <div class="stage-header">

                <div>

                    <div class="stage-number">

                        المرحلة ${escapeHTML(stageNumber)}

                    </div>


                    <h2 class="stage-title">

                        ${escapeHTML(group.title)}

                    </h2>


                    <p class="stage-description">

                        ${escapeHTML(group.description)}

                    </p>

                </div>

            </div>


            <div class="lesson-grid">

                ${group.lessons.map(lesson => `

                    <article class="lesson-card">


                        <div class="lesson-number">

                            <div class="lesson-index">

                                ${String(lesson.id).padStart(2,"0")}

                            </div>


                            <div class="lesson-level">

                                ${escapeHTML(lesson.difficulty)}

                            </div>

                        </div>


                        <h3>

                            ${escapeHTML(lesson.title)}

                        </h3>


                        <p class="lesson-topic">

                            ${escapeHTML(lesson.topic)}

                        </p>


                        <div class="lesson-meta">

                            <span class="meta-chip">

                                🎧 ${escapeHTML(lesson.source)}

                            </span>


                            <span class="meta-chip">

                                ⏱ ${escapeHTML(lesson.duration)}

                            </span>

                        </div>


                        <button
                            class="start-btn"
                            onclick="openLesson(${lesson.id})">

                            ابدأ الدرس

                        </button>


                    </article>

                `).join("")}

            </div>
        `;


        lessonsContainer.appendChild(section);

    });

}



/* =========================================================
   OPEN LESSON
   ========================================================= */

function openLesson(id){

    const lesson =
        lessons.find(item => item.id === id);

    if(!lesson) return;


    const currentIndex =
        lessons.findIndex(
            item => item.id === id
        );


    const previousLesson =
        lessons[currentIndex - 1];


    const nextLesson =
        lessons[currentIndex + 1];


    lessonView.innerHTML = `

        <div class="lesson-view-header">

            <div class="lesson-view-header-top">


                <div>

                    <div class="lesson-view-number">

                        الدرس
                        ${String(lesson.id).padStart(2,"0")}

                    </div>


                    <h2>

                        ${escapeHTML(lesson.title)}

                    </h2>


                    <p class="lesson-view-subtitle">

                        ${escapeHTML(lesson.topic)}

                    </p>

                </div>


                <button
                    class="back-btn"
                    onclick="closeLesson()">

                    ← العودة إلى الدروس

                </button>


            </div>

        </div>



        <div class="lesson-body">


            <!-- BEFORE LISTENING -->

            <section class="content-section">


                <div class="section-label">

                    <div class="section-icon">
                        👀
                    </div>


                    <h3>
                        قبل أن تستمع
                    </h3>

                </div>


                <div class="instruction">

                    ${escapeHTML(
                        lesson.beforeListening
                    )}

                </div>


                <div class="words-grid">


                    ${lesson.words.map(item => `

                        <div class="word-card">


                            <div class="word">

                                ${escapeHTML(item.word)}

                            </div>


                            <div class="word-note">

                                ${escapeHTML(item.note)}

                            </div>


                        </div>

                    `).join("")}

                </div>


            </section>



            <!-- FIRST LISTENING -->

            <section class="content-section">


                <div class="section-label">

                    <div class="section-icon">
                        🎧
                    </div>


                    <h3>
                        الاستماع الأول
                    </h3>

                </div>


                <div class="instruction">

                    ${escapeHTML(
                        lesson.listenFirst
                    )}

                </div>


                <div class="source-card">


                    <div class="source-info">

                        <div class="source-name">

                            ${escapeHTML(
                                lesson.source
                            )}

                        </div>


                        <div class="source-description">

                            ${escapeHTML(
                                lesson.sourceNote
                            )}

                        </div>

                    </div>


                    <a
                        class="source-btn"
                        href="${lesson.sourceUrl}"
                        target="_blank"
                        rel="noopener noreferrer">

                        🎧 فتح المقطع الأصلي

                    </a>


                </div>


            </section>



            <!-- SECOND LISTENING -->

            <section class="content-section">


                <div class="section-label">

                    <div class="section-icon">
                        🔁
                    </div>


                    <h3>
                        استمع مرة أخرى
                    </h3>

                </div>


                <div class="instruction">

                    ${escapeHTML(
                        lesson.listenAgain
                    )}

                </div>


            </section>



            <!-- READ & PRACTICE -->

            <section class="content-section">


                <div class="section-label">

                    <div class="section-icon">
                        📖
                    </div>


                    <h3>
                        اقرأ وتدرّب
                    </h3>

                </div>


                <div class="practice-box">


                    <div class="practice-title">

                        📚
                        ${escapeHTML(
                            lesson.practiceTitle
                        )}

                    </div>


                    <div class="practice-text">

                        ${escapeHTML(
                            lesson.practiceText
                        )}

                    </div>


                    <div class="practice-note">

                        ${escapeHTML(
                            lesson.practiceNote
                        )}

                    </div>


                </div>


            </section>



            <!-- TIP -->

            <section class="content-section">


                <div class="section-label">

                    <div class="section-icon">
                        💡
                    </div>


                    <h3>
                        تذكّر
                    </h3>

                </div>


                <div class="tip-box">

                    لا تحاول ترجمة كل كلمة تسمعها.

                    في الاستماع، من الطبيعي أن تفهم
                    بعض الكلمات وتفوتك كلمات أخرى.

                    ركّز على المعنى العام،
                    ومع تكرار الاستماع ستبدأ أذنك
                    بالتقاط تفاصيل أكثر.

                </div>


            </section>



            <!-- FINAL TASK -->

            <section class="content-section">


                <div class="section-label">

                    <div class="section-icon">
                        🏆
                    </div>


                    <h3>
                        التحدي الأخير
                    </h3>

                </div>


                <div class="final-task">


                    <h4>
                        جرّب مرة أخيرة
                    </h4>


                    <p>

                        ${escapeHTML(
                            lesson.finalTask
                        )}

                    </p>


                </div>


            </section>



            <!-- NAVIGATION -->

            <div class="lesson-navigation">


                <button
                    class="nav-lesson-btn"
                    ${previousLesson ? "" : "disabled"}
                    onclick="${
                        previousLesson
                            ? `openLesson(${previousLesson.id})`
                            : ""
                    }">

                    ← الدرس السابق

                </button>



                <button
                    class="nav-lesson-btn"
                    onclick="closeLesson()">

                    قائمة الدروس

                </button>



                <button
                    class="nav-lesson-btn primary"
                    ${nextLesson ? "" : "disabled"}
                    onclick="${
                        nextLesson
                            ? `openLesson(${nextLesson.id})`
                            : ""
                    }">

                    الدرس التالي →

                </button>


            </div>


        </div>

    `;


    lessonView.classList.add("active");


    lessonView.scrollIntoView({

        behavior:"smooth",

        block:"start"

    });

}



/* =========================================================
   CLOSE LESSON
   ========================================================= */

function closeLesson(){

    lessonView.classList.remove("active");


    setTimeout(() => {

        lessonView.innerHTML = "";

    },200);


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}



/* =========================================================
   START
   ========================================================= */

renderLessonCards();


</script>
