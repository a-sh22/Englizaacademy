<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Engliza Academy | Vocabulary</title>

<style>

/* =========================================================
   ENGLIZA ACADEMY — VOCABULARY
   الهوية البصرية الأساسية
========================================================= */

:root{
  --blue:#3157D5;
  --blue-dark:#233E9B;
  --purple:#7654D9;
  --purple-light:#EEEAFE;

  --gold:#D9A441;
  --gold-light:#FFF6DF;

  --text:#17213C;
  --muted:#6E7891;

  --white:#FFFFFF;
  --bg:#F7F8FC;
  --border:#E8EAF2;

  --shadow:0 12px 35px rgba(36,48,94,.08);
  --shadow-hover:0 18px 45px rgba(36,48,94,.13);

  --radius-xl:32px;
  --radius-lg:28px;
  --radius-md:22px;
  --radius-sm:17px;
}

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  background:var(--bg);
  color:var(--text);
  line-height:1.7;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
}

/* =========================================================
   PAGE
========================================================= */

.page{
  width:min(1180px, calc(100% - 32px));
  margin:0 auto;
  padding:28px 0 60px;
}

/* =========================================================
   HERO
========================================================= */

.hero{
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 85% 20%,
      rgba(255,255,255,.18),
      transparent 28%
    ),
    linear-gradient(
      135deg,
      var(--blue),
      var(--purple)
    );

  color:white;

  border-radius:var(--radius-xl);

  padding:38px 34px;

  box-shadow:
    0 18px 50px rgba(49,87,213,.18);

  margin-bottom:24px;
}

.hero::after{
  content:"";
  position:absolute;

  width:220px;
  height:220px;

  border-radius:50%;

  background:rgba(255,255,255,.07);

  left:-70px;
  bottom:-100px;
}

.hero-content{
  position:relative;
  z-index:2;
}

.academy-label{
  display:flex;
  align-items:center;
  gap:8px;

  font-size:12px;
  font-weight:800;

  letter-spacing:1.5px;

  margin-bottom:8px;

  opacity:.95;
}

.academy-dot{
  width:8px;
  height:8px;

  background:var(--gold);

  border-radius:50%;

  display:inline-block;
}

.hero h1{
  margin:0 0 8px;

  font-size:clamp(30px,5vw,46px);

  line-height:1.25;

  font-weight:900;
}

.hero p{
  margin:0;

  max-width:780px;

  font-size:16px;

  line-height:1.9;

  color:rgba(255,255,255,.9);
}

/* =========================================================
   PATH INFO
========================================================= */

.path-card{
  background:var(--white);

  border:1px solid var(--border);

  border-radius:var(--radius-md);

  padding:22px 24px;

  box-shadow:var(--shadow);

  margin-bottom:30px;
}

.path-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;

  margin-bottom:14px;
}

.path-title{
  font-size:18px;
  font-weight:900;
}

.path-count{
  color:var(--purple);
  font-weight:900;
  font-size:14px;
}

.progress-track{
  height:9px;

  background:#EEF0F7;

  border-radius:999px;

  overflow:hidden;
}

.progress-fill{
  width:0%;

  height:100%;

  background:
    linear-gradient(
      90deg,
      var(--blue),
      var(--purple)
    );

  border-radius:999px;

  transition:.35s ease;
}

/* =========================================================
   TOPIC LIST
========================================================= */

#topicsView{
  display:block;
}

.topic-stage{
  margin-bottom:54px;
}

.stage-header{
  background:var(--white);

  border:1px solid var(--border);

  border-radius:var(--radius-md);

  padding:20px 22px;

  box-shadow:var(--shadow);

  margin-bottom:20px;
}

.stage-header-inner{
  display:flex;
  align-items:center;
  gap:16px;
}

.stage-number{
  flex:0 0 auto;

  width:54px;
  height:54px;

  border-radius:17px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--purple-light);

  color:var(--purple);

  font-size:17px;
  font-weight:900;
}

.stage-info h2{
  margin:0 0 3px;

  font-size:21px;

  font-weight:900;
}

.stage-info p{
  margin:0;

  color:var(--muted);

  font-size:14px;
}

/* =========================================================
   TOPIC GRID
========================================================= */

.topic-grid{
  display:grid;

  grid-template-columns:
    repeat(3, minmax(0,1fr));

  gap:18px;
}

.topic-card{
  position:relative;

  background:var(--white);

  border:1px solid var(--border);

  border-radius:var(--radius-lg);

  padding:23px;

  box-shadow:var(--shadow);

  transition:
    transform .22s ease,
    box-shadow .22s ease,
    border-color .22s ease;

  cursor:pointer;

  min-height:210px;

  display:flex;
  flex-direction:column;
}

.topic-card:hover{
  transform:translateY(-4px);

  box-shadow:var(--shadow-hover);

  border-color:#DADDF0;
}

.topic-icon{
  width:58px;
  height:58px;

  border-radius:18px;

  background:var(--purple-light);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:30px;

  margin-bottom:17px;
}

.topic-card h3{
  margin:0 0 7px;

  font-size:19px;

  font-weight:900;
}

.topic-card p{
  margin:0;

  color:var(--muted);

  font-size:14px;

  line-height:1.8;

  flex:1;
}

.topic-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-top:18px;
}

.topic-count{
  color:var(--muted);

  font-size:13px;

  font-weight:700;
}

.topic-open{
  color:var(--blue);

  font-weight:900;

  font-size:13px;
}

/* =========================================================
   TOPIC VIEW
========================================================= */

#topicView{
  display:none;
}

.topic-view-card{
  background:var(--white);

  border:1px solid var(--border);

  border-radius:30px;

  box-shadow:var(--shadow);

  overflow:hidden;
}

.topic-view-header{
  background:
    radial-gradient(
      circle at 85% 20%,
      rgba(255,255,255,.15),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      var(--blue),
      var(--purple)
    );

  color:white;

  padding:28px 28px 30px;
}

.topic-view-header-top{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:18px;

  margin-bottom:22px;
}

.back-button{
  border:1px solid rgba(255,255,255,.25);

  background:rgba(255,255,255,.12);

  color:white;

  padding:10px 16px;

  border-radius:14px;

  font-weight:800;

  transition:.2s ease;
}

.back-button:hover{
  background:rgba(255,255,255,.2);
}

.topic-number{
  font-size:13px;

  font-weight:800;

  opacity:.9;
}

.topic-view-header h2{
  margin:0 0 7px;

  font-size:clamp(26px,4vw,36px);

  font-weight:900;
}

.topic-view-header p{
  margin:0;

  color:rgba(255,255,255,.88);

  font-size:15px;
}

/* =========================================================
   VOCABULARY GRID
========================================================= */

.words-container{
  padding:28px;
}

.words-intro{
  background:var(--purple-light);

  border-radius:18px;

  padding:15px 18px;

  margin-bottom:24px;

  color:#51438C;

  font-size:14px;

  line-height:1.8;
}

.words-grid{
  display:grid;

  grid-template-columns:
    repeat(2, minmax(0,1fr));

  gap:18px;
}

/* =========================================================
   WORD CARD
========================================================= */

.word-card{
  background:var(--white);

  border:1px solid var(--border);

  border-radius:24px;

  padding:20px;

  box-shadow:
    0 8px 24px rgba(36,48,94,.055);

  transition:
    box-shadow .2s ease,
    transform .2s ease;
}

.word-card:hover{
  box-shadow:
    0 14px 32px rgba(36,48,94,.09);

  transform:translateY(-2px);
}

.word-top{
  display:flex;

  align-items:flex-start;

  gap:15px;

  margin-bottom:17px;
}

.word-image{
  width:76px;
  height:76px;

  flex:0 0 76px;

  border-radius:20px;

  background:#F4F5FA;

  border:1px solid var(--border);

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.word-image img{
  width:58px;
  height:58px;

  object-fit:contain;
}

.word-image-fallback{
  font-size:40px;
  line-height:1;
}

.word-main{
  min-width:0;

  flex:1;
}

.word-english{
  font-size:25px;

  line-height:1.2;

  font-weight:900;

  direction:ltr;

  text-align:left;

  color:var(--text);

  word-break:break-word;
}

.word-meaning{
  margin-top:6px;

  color:var(--purple);

  font-weight:900;

  font-size:16px;
}

.word-meaning-note{
  margin-top:4px;

  color:var(--muted);

  font-size:12px;

  line-height:1.7;
}

.pronounce-button{
  margin-top:11px;

  border:0;

  background:var(--blue);

  color:white;

  border-radius:13px;

  padding:8px 12px;

  font-size:12px;

  font-weight:800;

  display:inline-flex;

  align-items:center;

  gap:6px;

  transition:.2s ease;
}

.pronounce-button:hover{
  background:var(--blue-dark);
}

.pronounce-button.speaking{
  background:var(--purple);
}

/* =========================================================
   EXAMPLES
========================================================= */

.examples{
  border-top:1px solid var(--border);

  padding-top:17px;

  display:flex;

  flex-direction:column;

  gap:13px;
}

.example{
  padding:13px 14px;

  background:#FAFAFD;

  border-radius:15px;

  border:1px solid #EFF0F6;
}

.example-en{
  direction:ltr;

  text-align:left;

  font-size:15px;

  font-weight:800;

  color:var(--text);

  margin-bottom:3px;
}

.example-ar{
  color:var(--muted);

  font-size:13px;

  line-height:1.7;
}

/* =========================================================
   BOTTOM NAVIGATION
========================================================= */

.topic-navigation{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  padding:22px 28px 28px;

  border-top:1px solid var(--border);
}

.nav-button{
  border:1px solid var(--border);

  background:var(--white);

  color:var(--text);

  padding:11px 16px;

  border-radius:14px;

  font-weight:800;

  transition:.2s ease;
}

.nav-button:hover{
  border-color:#D7DAEA;

  box-shadow:0 8px 18px rgba(36,48,94,.06);
}

.nav-button.primary{
  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--purple)
    );

  border-color:transparent;

  color:white;
}

.nav-button:disabled{
  opacity:.4;

  cursor:not-allowed;

  box-shadow:none;
}

/* =========================================================
   EMPTY / SEARCH
========================================================= */

.search-card{
  background:var(--white);

  border:1px solid var(--border);

  border-radius:22px;

  box-shadow:var(--shadow);

  padding:18px;

  margin-bottom:28px;
}

.search-input{
  width:100%;

  border:1px solid var(--border);

  background:#FAFAFD;

  border-radius:15px;

  padding:13px 15px;

  outline:none;

  color:var(--text);

  transition:.2s ease;
}

.search-input:focus{
  border-color:var(--blue);

  background:white;

  box-shadow:
    0 0 0 4px rgba(49,87,213,.08);
}

.no-results{
  background:white;

  border:1px solid var(--border);

  border-radius:22px;

  padding:30px;

  text-align:center;

  color:var(--muted);
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
  text-align:center;

  color:var(--muted);

  font-size:12px;

  margin-top:30px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:980px){

  .topic-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}

@media(max-width:720px){

  .page{
    width:min(100% - 20px,1180px);

    padding-top:12px;
  }

  .hero{
    padding:30px 22px;

    border-radius:28px;
  }

  .path-card{
    padding:18px;
  }

  .stage-header{
    padding:18px;
  }

  .stage-header-inner{
    align-items:flex-start;
  }

  .stage-number{
    width:48px;
    height:48px;

    border-radius:15px;
  }

  .stage-info h2{
    font-size:18px;
  }

  .topic-grid{
    grid-template-columns:1fr;

    gap:14px;
  }

  .topic-card{
    min-height:185px;

    padding:20px;
  }

  .words-container{
    padding:20px;
  }

  .words-grid{
    grid-template-columns:1fr;

    gap:15px;
  }

  .topic-view-header{
    padding:22px 20px 24px;
  }

  .topic-view-header-top{
    align-items:flex-start;
  }

  .topic-navigation{
    padding:18px 20px 22px;

    flex-wrap:wrap;
  }

  .nav-button{
    flex:1;
    min-width:110px;
  }

}

@media(max-width:430px){

  .hero h1{
    font-size:30px;
  }

  .word-top{
    gap:11px;
  }

  .word-image{
    width:65px;
    height:65px;

    flex-basis:65px;
  }

  .word-image img{
    width:50px;
    height:50px;
  }

  .word-english{
    font-size:22px;
  }

}

/* =========================================================
   ACCESSIBILITY
========================================================= */

button:focus-visible,
input:focus-visible{
  outline:3px solid rgba(49,87,213,.2);

  outline-offset:2px;
}

</style>
</head>

<div class="page">

  <!-- =====================================================
       HERO
  ====================================================== -->

  <section class="hero">

    <div class="hero-content">

      <div class="academy-label">
        <span class="academy-dot"></span>

      <h1>📚 المفردات</h1>

  </section>


  <!-- =====================================================

  ====================================================== -->

      >

    </div>

    <div id="topicsContainer"></div>

  </main>


  <!-- =====================================================
       SINGLE TOPIC VIEW
  ====================================================== -->

  <main id="topicView">

    <div class="topic-view-card">

      <div class="topic-view-header">

        <div class="topic-view-header-top">

          <button
            class="back-button"
            type="button"
            onclick="closeTopic()"
          >
            ← العودة إلى المفردات
          </button>

          <div
            class="topic-number"

        </div>

        <h2 id="topicTitle"></h2>

        <p id="topicDescription"></p>

      </div>


      <div class="words-container">

        </div>

        <div
          class="words-grid"
          id="wordsGrid"
        ></div>

      </div>


      <div class="topic-navigation">

        <button
          id="previousButton"
          class="nav-button"
          type="button"
          onclick="openPreviousTopic()"
        >
          → السابق
        </button>

        <button
          class="nav-button primary"
          type="button"
          onclick="closeTopic()"
        >
          📚 كل الوحدات
        </button>

        <button
          id="nextButton"
          class="nav-button"
          type="button"
          onclick="openNextTopic()"
        >
          التالي ←
        </button>

      </div>

    </div>

  </main>


  <div class="footer">
    Engliza Academy · Beginner Vocabulary
  </div>

</div>

/* =========================================================
   WORD HELPER
========================================================= */

function word(
  english,
  meaning,
  emoji,
  noteOrExamples,
  maybeExamples
){

  let note = "";
  let examples = [];

  if(Array.isArray(noteOrExamples)){
    examples = noteOrExamples;
  }else{
    note = noteOrExamples || "";
    examples = maybeExamples || [];
  }

  return {
    english,
    meaning,
    emoji,
    note,
    examples
  };
}


/* =========================================================
   DOM
========================================================= */

const topicsView = document.getElementById("topicsView");
const topicView = document.getElementById("topicView");

const topicsContainer =
  document.getElementById("topicsContainer");

const wordsGrid =
  document.getElementById("wordsGrid");

const topicTitle =
  document.getElementById("topicTitle");

const topicDescription =
  document.getElementById("topicDescription");

const topicNumber =
  document.getElementById("topicNumber");

const previousButton =
  document.getElementById("previousButton");

const nextButton =
  document.getElementById("nextButton");

const searchInput =
  document.getElementById("searchInput");

const progressFill =
  document.getElementById("progressFill");

const progressText =
  document.getElementById("progressText");


let currentTopicIndex = -1;


/* =========================================================
   TWEMOJI IMAGE
========================================================= */

function emojiCodePoint(emoji){

  return Array
    .from(emoji)
    .map(char => {

      const code = char.codePointAt(0)
        .toString(16);

      return code;

    })
    .join("-");

}


function getEmojiImageURL(emoji){

  const code =
    emojiCodePoint(
      emoji
        .replace(/\uFE0F/g,"")
    );

  return
    "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/"
    + code
    + ".svg";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   RENDER TOPICS
========================================================= */

function renderTopics(){

  const query =
    searchInput.value
      .trim()
      .toLowerCase();

  const grouped = {};

  topics.forEach((topic,index)=>{

    const searchableText = [

      topic.title,
      topic.description,

      ...topic.words.map(item =>
        item.english + " " +
        item.meaning
      )

    ]
      .join(" ")
      .toLowerCase();

    if(
      query &&
      !searchableText.includes(query)
    ){
      return;
    }

    if(!grouped[topic.stage]){
      grouped[topic.stage] = [];
    }

    grouped[topic.stage].push({
      topic,
      index
    });

  });


  let html = "";


  Object.keys(grouped)
    .sort((a,b)=>Number(a)-Number(b))
    .forEach(stageNumber=>{

      const firstTopic =
        grouped[stageNumber][0].topic;

      html += `

        <section class="topic-stage">

          <div class="stage-header">

            <div class="stage-header-inner">

              <div class="stage-number">
                ${escapeHTML(stageNumber)}
              </div>

              <div class="stage-info">

                <h2>
                  ${escapeHTML(firstTopic.stageTitle)}
                </h2>

                <p>
                  ${escapeHTML(firstTopic.stageDescription)}
                </p>

              </div>

            </div>

          </div>

          <div class="topic-grid">
      `;


      grouped[stageNumber]
        .forEach(({topic,index})=>{

          html += `

            <article
              class="topic-card"
              onclick="openTopic(${index})"
              tabindex="0"
              onkeydown="handleTopicKey(event,${index})"
            >

              <div class="topic-icon">
                ${escapeHTML(topic.icon)}
              </div>

              <h3>
                ${escapeHTML(topic.title)}
              </h3>

              <p>
                ${escapeHTML(topic.description)}
              </p>

              <div class="topic-footer">

                <span class="topic-count">
                  ${topic.words.length} كلمات
                </span>

                <span class="topic-open">
                  ابدأ →
                </span>

              </div>

            </article>

          `;

        });


      html += `
          </div>
        </section>
      `;

    });


  if(!html){

    html = `

      <div class="no-results">
        لم نجد نتيجة مطابقة للبحث.
      </div>

    `;

  }


  topicsContainer.innerHTML = html;

}


/* =========================================================
   OPEN TOPIC
========================================================= */

function openTopic(index){

  if(
    index < 0 ||
    index >= topics.length
  ){
    return;
  }

  currentTopicIndex = index;

  const topic = topics[index];

  topicTitle.textContent =
    topic.title;

  topicDescription.textContent =
    topic.description;

  topicNumber.textContent =
    `الوحدة ${index + 1} من ${topics.length}`;


  wordsGrid.innerHTML =
    topic.words
      .map((item,wordIndex)=>
        renderWordCard(item,wordIndex)
      )
      .join("");


  previousButton.disabled =
    index === 0;

  nextButton.disabled =
    index === topics.length - 1;


  topicsView.style.display = "none";

  topicView.style.display = "block";


  updateProgress(index);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   CLOSE TOPIC
========================================================= */

function closeTopic(){

  stopSpeaking();

  topicView.style.display = "none";

  topicsView.style.display = "block";

  currentTopicIndex = -1;

  updateProgress(-1);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   RENDER WORD CARD
========================================================= */

function renderWordCard(item,index){

  const imageURL =
    getEmojiImageURL(item.emoji);


  const examplesHTML =
    item.examples
      .map(example=>`

        <div class="example">

          <div class="example-en">
            ${escapeHTML(example[0])}
          </div>

          <div class="example-ar">
            ${escapeHTML(example[1])}
          </div>

        </div>

      `)
      .join("");


  const noteHTML =
    item.note
      ? `
        <div class="word-meaning-note">
          ${escapeHTML(item.note)}
        </div>
      `
      : "";


  return `

    <article class="word-card">

      <div class="word-top">

        <div class="word-image">

          <img
            src="${imageURL}"
            alt="${escapeHTML(item.meaning)}"
            loading="lazy"
            onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=&quot;word-image-fallback&quot;>${escapeHTML(item.emoji)}</span>';"
          >

        </div>


        <div class="word-main">

          <div class="word-english">
            ${escapeHTML(item.english)}
          </div>

          <div class="word-meaning">
            ${escapeHTML(item.meaning)}
          </div>

          ${noteHTML}

          <button
            class="pronounce-button"
            type="button"
            onclick="speakWord(${index})"
          >
            🔊 استمع للنطق
          </button>

        </div>

      </div>


      <div class="examples">

        ${examplesHTML}

      </div>

    </article>

  `;

}


/* =========================================================
   SPEECH SYNTHESIS
========================================================= */

let activeSpeechButton = null;


function findEnglishVoice(){

  const voices =
    window.speechSynthesis
      ? window.speechSynthesis.getVoices()
      : [];

  return (

    voices.find(
      voice =>
        voice.lang &&
        voice.lang.toLowerCase() === "en-us"
    )

    ||

    voices.find(
      voice =>
        voice.lang &&
        voice.lang.toLowerCase().startsWith("en")
    )

    ||

    null

  );

}


function speakWord(wordIndex){

  if(
    currentTopicIndex < 0 ||
    !topics[currentTopicIndex]
  ){
    return;
  }

  const topic =
    topics[currentTopicIndex];

  const item =
    topic.words[wordIndex];

  if(!item){
    return;
  }


  stopSpeaking();


  if(!("speechSynthesis" in window)){
    alert(
      "ميزة النطق غير متاحة على هذا الجهاز."
    );
    return;
  }


  const utterance =
    new SpeechSynthesisUtterance(
      item.english
    );

  utterance.lang = "en-US";

  utterance.rate = 0.82;

  utterance.pitch = 1;


  const voice =
    findEnglishVoice();

  if(voice){
    utterance.voice = voice;
  }


  const buttons =
    wordsGrid.querySelectorAll(
      ".pronounce-button"
    );

  activeSpeechButton =
    buttons[wordIndex] || null;


  if(activeSpeechButton){

    activeSpeechButton.classList.add(
      "speaking"
    );

    activeSpeechButton.innerHTML =
      "🔊 يستمع...";

  }


  utterance.onend = ()=>{
    resetSpeechButton();
  };

  utterance.onerror = ()=>{
    resetSpeechButton();
  };


  window.speechSynthesis.speak(
    utterance
  );

}


function resetSpeechButton(){

  if(activeSpeechButton){

    activeSpeechButton.classList.remove(
      "speaking"
    );

    activeSpeechButton.innerHTML =
      "🔊 استمع للنطق";

    activeSpeechButton = null;

  }

}


function stopSpeaking(){

  if(
    "speechSynthesis" in window
  ){

    window.speechSynthesis.cancel();

  }

  resetSpeechButton();

}


/* =========================================================
   NAVIGATION
========================================================= */

function openPreviousTopic(){

  if(
    currentTopicIndex > 0
  ){

    openTopic(
      currentTopicIndex - 1
    );

  }

}


function openNextTopic(){

  if(
    currentTopicIndex <
    topics.length - 1
  ){

    openTopic(
      currentTopicIndex + 1
    );

  }

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress(index){

  if(index < 0){

    progressFill.style.width = "0%";

    progressText.textContent =
      `${topics.length} وحدة`;

    return;

  }


  const percent =
    ((index + 1) / topics.length) * 100;

  progressFill.style.width =
    `${percent}%`;

  progressText.textContent =
    `${index + 1} / ${topics.length}`;

}


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
  "input",
  renderTopics
);


/* =========================================================
   KEYBOARD
========================================================= */

function handleTopicKey(event,index){

  if(
    event.key === "Enter" ||
    event.key === " "
  ){

    event.preventDefault();

    openTopic(index);

  }

}


/* =========================================================
   LOAD VOICES
========================================================= */

if(
  "speechSynthesis" in window
){

  window.speechSynthesis.onvoiceschanged =
    function(){};

}


/* =========================================================
   INITIAL RENDER
========================================================= */

renderTopics();

updateProgress(-1);
