<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Engliza Academy | Login</title>


<style>

/* =========================================================
   ENGLIZA LOGIN — CLASSROOM EXPERIENCE
   ========================================================= */

:root{

    --blue:#3157D5;

    --blue-dark:#233E9B;

    --purple:#7654D9;

    --purple-dark:#5438B7;

    --gold:#D9A441;

    --text:#17213C;

    --muted:#68738D;

    --white:#FFFFFF;

    --border:rgba(49,87,213,.12);

    --shadow:
        0 24px 70px rgba(27,38,84,.20);
}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,
body{

    width:100%;

    min-height:100%;

}


body{

    min-height:100vh;

    overflow:hidden;

    font-family:
        Arial,
        "Segoe UI",
        sans-serif;

    background:#eef3ff;

}


/* =========================================================
   MAIN CLASSROOM
   ========================================================= */

.login-page{

    position:relative;

    width:100%;

    height:100vh;

    min-height:620px;

    overflow:hidden;

    background:#eef3ff;

}


/* =========================================================
   CLASSROOM IMAGE
   ========================================================= */

.classroom-scene{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    object-fit:cover;

    z-index:1;

    user-select:none;

    -webkit-user-drag:none;

}


/* =========================================================
   CINEMATIC OVERLAY
   ========================================================= */

.scene-overlay{

    position:absolute;

    inset:0;

    z-index:2;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            rgba(15,24,55,.02) 0%,
            rgba(15,24,55,.02) 50%,
            rgba(255,255,255,.06) 100%
        );

}


/* =========================================================
   LOGIN AREA
   ========================================================= */

/*
   The login area contains:
   1. Welcome text
   2. Real login panel
*/

.login-area{

    position:absolute;

    z-index:10;

    top:50%;

    right:8%;

    width:min(390px,32vw);

    transform:translateY(-50%);

}


/* =========================================================
   WELCOME / BRAND
   خارج الـ glass panel
   ========================================================= */

.login-brand{

    text-align:center;

    margin-bottom:16px;

    padding:0 8px;

    text-shadow:
        0 2px 12px rgba(255,255,255,.70);

}


.brand-name{

    color:var(--blue-dark);

    font-size:13px;

    font-weight:900;

    letter-spacing:3px;

    margin-bottom:8px;

}


.login-accent{

    width:38px;

    height:4px;

    margin:
        0 auto 12px;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--purple)
        );

}


.login-title{

    color:var(--text);

    font-size:29px;

    line-height:1.15;

    font-weight:900;

    margin-bottom:7px;

}


.login-subtitle{

    color:#5D6780;

    font-size:13px;

    line-height:1.7;

    font-weight:600;

}


/* =========================================================
   REAL LOGIN PANEL
   ========================================================= */

.login-panel{

    width:100%;

    padding:27px 29px 25px;

    border-radius:27px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.91),
            rgba(248,249,255,.82)
        );

    border:
        1px solid rgba(255,255,255,.88);

    box-shadow:

        0 25px 65px
        rgba(30,40,90,.20),

        inset 0 1px 0
        rgba(255,255,255,.96);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

}


/* =========================================================
   MODE SWITCH
   ========================================================= */

.mode-switch{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:5px;

    padding:5px;

    margin-bottom:20px;

    border-radius:14px;

    background:
        rgba(238,241,250,.90);

}


.mode-btn{

    min-height:51px;

    border:none;

    border-radius:10px;

    background:transparent;

    color:#737C94;

    font-size:13px;

    font-weight:800;

    cursor:pointer;

    transition:.2s ease;

}


.mode-btn:hover{

    color:var(--blue);

}


.mode-btn.active{

    background:white;

    color:var(--blue);

    box-shadow:
        0 4px 14px
        rgba(40,55,110,.10);

}


.mode-title{

    display:block;

    font-size:13px;

    font-weight:900;

    line-height:1.2;

}


.mode-note{

    display:block;

    margin-top:4px;

    color:#9AA2B3;

    font-size:9px;

    font-weight:500;

    line-height:1.3;

}


.mode-btn.active .mode-note{

    color:#7E89A1;

}


/* =========================================================
   FORMS
   ========================================================= */

.auth-form{

    display:none;

}


.auth-form.active{

    display:block;

}


/* =========================================================
   FIELD
   ========================================================= */

.field{

    margin-bottom:13px;

}


.field-label{

    display:block;

    margin-bottom:7px;

    color:#4F5870;

    font-size:12px;

    font-weight:800;

}


.input-wrap{

    position:relative;

}


.auth-input{

    width:100%;

    height:48px;

    padding:
        0 15px;

    border:
        1px solid #E0E4EF;

    border-radius:13px;

    background:
        rgba(255,255,255,.95);

    color:var(--text);

    font-size:14px;

    outline:none;

    direction:rtl;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;

}


.auth-input::placeholder{

    color:#A1A8B8;

}


.auth-input:focus{

    border-color:var(--blue);

    box-shadow:
        0 0 0 4px
        rgba(49,87,213,.09);

}


/* =========================================================
   PASSWORD
   ========================================================= */

.password-row{

    position:relative;

}


.password-toggle{

    position:absolute;

    left:11px;

    top:50%;

    transform:translateY(-50%);

    width:34px;

    height:34px;

    border:none;

    border-radius:9px;

    background:transparent;

    color:#7D879D;

    cursor:pointer;

    font-size:16px;

}


/* =========================================================
   FORGOT PASSWORD
   ========================================================= */

.forgot-row{

    display:flex;

    justify-content:flex-start;

    margin-top:-3px;

    margin-bottom:15px;

}


.forgot-password{

    color:var(--blue);

    font-size:12px;

    font-weight:800;

    text-decoration:none;

    cursor:pointer;

}


.forgot-password:hover{

    text-decoration:underline;

}


/* =========================================================
   MAIN BUTTON
   ========================================================= */

.submit-btn{

    width:100%;

    height:50px;

    border:none;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #4359E8,
            #5A39D6
        );

    color:white;

    font-size:15px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 10px 25px
        rgba(67,89,232,.24);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        opacity .2s ease;

}


.submit-btn:hover{

    transform:translateY(-1px);

    box-shadow:
        0 14px 30px
        rgba(67,89,232,.30);

}


.submit-btn:active{

    transform:translateY(0);

}


.submit-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

}


/* =========================================================
   REGISTER NOTE
   ========================================================= */

.password-note{

    margin:
        -2px 0 14px;

    color:#737C91;

    font-size:11px;

    line-height:1.7;

    text-align:right;

}


/* =========================================================
   MESSAGES
   ========================================================= */

.message{

    display:none;

    margin-top:12px;

    padding:11px 12px;

    border-radius:11px;

    font-size:12px;

    line-height:1.7;

    text-align:center;

    font-weight:700;

}


.message.success{

    display:block;

    background:#EAF8F0;

    color:#237957;

    border:1px solid #CDEBDD;

}


.message.error{

    display:block;

    background:#FFF0F0;

    color:#C62828;

    border:1px solid #F4D2D2;

}


/* =========================================================
   SUPPORT
   ========================================================= */

.support-box{

    margin-top:16px;

    text-align:center;

    color:#737C91;

    font-size:11px;

    line-height:1.8;

}


.support-email{

    color:var(--blue);

    font-weight:800;

    text-decoration:none;

}


.support-email:hover{

    text-decoration:underline;

}


/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width:1101px){

    .login-area{

        right:8.5%;

        width:380px;

    }

    .login-panel{

        padding:27px 30px 25px;

    }

}


/* =========================================================
   LAPTOP / SMALL DESKTOP
   ========================================================= */

@media
(min-width:901px)
and
(max-width:1100px){

    .login-area{

        right:5.5%;

        width:350px;

    }

    .login-panel{

        padding:25px 27px 23px;

    }

    .login-title{

        font-size:26px;

    }

}


/* =========================================================
   IPAD LANDSCAPE
   ========================================================= */

@media
(min-width:701px)
and
(max-width:1100px)
and
(orientation:landscape){

    .login-area{

        right:5%;

        width:min(360px,37vw);

    }

    .login-panel{

        padding:24px 24px 22px;

        border-radius:24px;

    }

    .login-brand{

        margin-bottom:13px;

    }

    .login-title{

        font-size:24px;

    }

    .login-subtitle{

        font-size:12px;

    }

    .auth-input{

        height:45px;

    }

    .submit-btn{

        height:47px;

    }

}


/* =========================================================
   TABLET PORTRAIT
   ========================================================= */

@media
(min-width:601px)
and
(max-width:900px)
and
(orientation:portrait){

    .login-page{

        min-height:100vh;

    }

    .classroom-scene{

        object-position:center center;

    }

    .login-area{

        top:50%;

        right:50%;

        width:min(480px,78vw);

        transform:
            translate(50%,-50%);

    }

    .login-panel{

        padding:25px;

        border-radius:25px;

    }

    .login-title{

        font-size:25px;

    }

    .login-subtitle{

        font-size:12px;

    }

}


/* =========================================================
   PHONE
   ========================================================= */

@media (max-width:600px){

    body{

        overflow:hidden;

    }


    .login-page{

        min-height:100svh;

        height:100svh;

    }


    .classroom-scene{

        object-position:center center;

    }


    /*
       The login interface is now centered.
       The background remains visible around it.
    */

    .login-area{

        top:50%;

        right:50%;

        width:84%;

        max-width:390px;

        transform:
            translate(50%,-50%);

    }


    /* =====================================================
       MOBILE WELCOME
       ===================================================== */

    .login-brand{

        margin-bottom:10px;

        padding:0 5px;

        text-shadow:
            0 2px 10px
            rgba(255,255,255,.82);

    }


    .brand-name{

        font-size:8px;

        letter-spacing:1.8px;

        margin-bottom:5px;

    }


    .login-accent{

        width:25px;

        height:3px;

        margin-bottom:7px;

    }


    .login-title{

        font-size:19px;

        margin-bottom:3px;

    }


    .login-subtitle{

        font-size:8px;

        line-height:1.5;

    }


    /* =====================================================
       MOBILE PANEL
       ===================================================== */

    .login-panel{

        padding:16px 15px 14px;

        border-radius:20px;

        background:
            linear-gradient(
                145deg,
                rgba(255,255,255,.93),
                rgba(248,249,255,.87)
            );

        backdrop-filter:blur(15px);

        -webkit-backdrop-filter:blur(15px);

        box-shadow:

            0 18px 45px
            rgba(30,40,90,.22),

            inset 0 1px 0
            rgba(255,255,255,.95);

    }


    /* =====================================================
       MOBILE MODE SWITCH
       ===================================================== */

    .mode-switch{

        gap:3px;

        padding:3px;

        margin-bottom:11px;

        border-radius:10px;

    }


    .mode-btn{

        min-height:40px;

        border-radius:8px;

    }


    .mode-title{

        font-size:9px;

    }


    .mode-note{

        margin-top:2px;

        font-size:6.5px;

    }


    /* =====================================================
       MOBILE FIELDS
       ===================================================== */

    .field{

        margin-bottom:7px;

    }


    .field-label{

        font-size:8px;

        margin-bottom:4px;

    }


    .auth-input{

        height:34px;

        padding:
            0 9px;

        border-radius:9px;

        font-size:9px;

    }


    .password-toggle{

        width:25px;

        height:25px;

        left:5px;

        font-size:11px;

    }


    /* =====================================================
       MOBILE FORGOT PASSWORD
       ===================================================== */

    .forgot-row{

        margin-top:-1px;

        margin-bottom:8px;

    }


    .forgot-password{

        font-size:8px;

    }


    /* =====================================================
       MOBILE BUTTON
       ===================================================== */

    .submit-btn{

        height:35px;

        border-radius:9px;

        font-size:9px;

    }


    /* =====================================================
       MOBILE REGISTER NOTE
       ===================================================== */

    .password-note{

        font-size:7px;

        margin-bottom:8px;

    }


    /* =====================================================
       MOBILE MESSAGES
       ===================================================== */

    .message{

        margin-top:7px;

        padding:7px;

        border-radius:8px;

        font-size:8px;

    }


    /* =====================================================
       MOBILE SUPPORT
       ===================================================== */

    .support-box{

        margin-top:7px;

        font-size:7px;

        line-height:1.5;

    }

}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width:390px){

    .login-area{

        width:87%;

    }


    .login-brand{

        margin-bottom:7px;

    }


    .login-title{

        font-size:17px;

    }


    .login-subtitle{

        font-size:7px;

    }


    .login-panel{

        padding:13px 12px 11px;

        border-radius:18px;

    }


    .mode-btn{

        min-height:37px;

    }


    .mode-title{

        font-size:8px;

    }


    .mode-note{

        font-size:6px;

    }


    .auth-input{

        height:31px;

        font-size:8px;

    }


    .submit-btn{

        height:32px;

        font-size:8px;

    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        transition:none !important;

        animation:none !important;

    }

}

</style>

<body>


<div class="login-page">


    <!-- =====================================================
         RESPONSIVE CLASSROOM IMAGE
         ===================================================== -->

    <picture>


        <!-- =================================================
             PORTRAIT

        <div class="login-brand">


            <div class="brand-name">

                    </label>


                    <input

                </div>


                <div class="field">


                    <label
                        class="field-label"
                        for="loginPassword"

                        كلمة المرور

                    </label>


                    <div class="password-row">


                        <input
                            id="loginPassword"
                            class="auth-input"
                            type="password"
                            autocomplete="current-password"
                            placeholder="أدخل كلمة المرور"
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            id="loginPasswordToggle"
                            aria-label="إظهار كلمة المرور"

                            👁

                        </button>


                    </div>


                </div>


                <div class="forgot-row">

                        نسيت كلمة المرور؟

                    </a>


                </div>


                <button
                    id="loginSubmitBtn"
                    type="submit"
                    class="submit-btn"
                >

                    تسجيل الدخول

                </button>


                <div
                    id="loginMessage"
                    class="message"
                >
                </div>


            </form>


            <!-- =================================================
                 REGISTER FORM
                 ================================================= -->

            <form
                id="registerForm"
                class="auth-form"
                novalidate
            >


                <div class="field">


                    <label
                        class="field-label"
                        for="registerName"
                    >

                        الاسم الكامل

                    </label>


                    <input
                        id="registerName"
                        class="auth-input"
                        type="text"
                        autocomplete="name"
                        placeholder="اكتب اسمك الكامل"
                    >


                </div>


                <div class="field">


                    <label
                        class="field-label"
                        for="registerEmail"
                    >

                        البريد الإلكتروني

                    </label>


                    <input
                        id="registerEmail"
                        class="auth-input"
                        type="email"
                        autocomplete="email"
                        placeholder="أدخل بريدك الإلكتروني"
                    >


                </div>


                <div class="field">


                    <label
                        class="field-label"
                        for="registerPassword"
                    >

                        كلمة المرور

                    </label>


                    <div class="password-row">


                        <input
                            id="registerPassword"
                            class="auth-input"
                            type="password"
                            autocomplete="new-password"
                            placeholder="أنشئ كلمة مرور"
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            id="registerPasswordToggle"
                            aria-label="إظهار كلمة المرور"
                        >

                            👁

                        </button>


                    </div>


                </div>


                <p class="password-note">

                    🔒 احتفظ بكلمة المرور في مكان آمن،
                    ستحتاج إليها عند تسجيل الدخول لاحقًا.

                </p>


                <button
                    id="registerSubmitBtn"
                    type="submit"
                    class="submit-btn"
                >

                    إنشاء الحساب

                </button>


                <div
                    id="registerMessage"
                    class="message"
                >
                </div>


            </form>


            <!-- =================================================
                 SUPPORT
                 ================================================= -->

            <div class="support-box">


                <div>

                    إذا واجهتك مشكلة، تواصل مع فريق الأكاديمية 🤝

                </div>


                <a
                    href="mailto:support@englizaacademy.com"
                    class="support-email"
                >

                    support@englizaacademy.com

                </a>


            </div>


        </div>


    </div>


</div>

const loginPassword =
    document.getElementById("loginPassword");


const loginSubmitBtn =
    document.getElementById("loginSubmitBtn");


const loginMessage =
    document.getElementById("loginMessage");


const registerName =
    document.getElementById("registerName");


const registerEmail =
    document.getElementById("registerEmail");


const registerPassword =
    document.getElementById("registerPassword");


const registerSubmitBtn =
    document.getElementById("registerSubmitBtn");


const registerMessage =
    document.getElementById("registerMessage");


const forgotPassword =
    document.getElementById("forgotPassword");



/* =========================================================
   SWITCH LOGIN / REGISTER
   ========================================================= */

function showLoginMode(){


    loginForm.classList.add(
        "active"
    );


    registerForm.classList.remove(
        "active"
    );


    loginModeBtn.classList.add(
        "active"
    );


    registerModeBtn.classList.remove(
        "active"
    );

}


function showRegisterMode(){


    registerForm.classList.add(
        "active"
    );


    loginForm.classList.remove(
        "active"
    );


    registerModeBtn.classList.add(
        "active"
    );


    loginModeBtn.classList.remove(
        "active"
    );

}


loginModeBtn.addEventListener(
    "click",
    showLoginMode
);


registerModeBtn.addEventListener(
    "click",
    showRegisterMode
);



/* =========================================================
   PASSWORD VISIBILITY
   ========================================================= */

function togglePassword(
    input,
    button
){


    if(
        input.type === "password"
    ){

        input.type = "text";

        button.textContent =
            "🙈";

    }

    else{

        input.type = "password";

        button.textContent =
            "👁";

    }

}


document
    .getElementById(
        "loginPasswordToggle"
    )
    .addEventListener(
        "click",
        function(){

            togglePassword(
                loginPassword,
                this
            );

        }
    );


document
    .getElementById(
        "registerPasswordToggle"
    )
    .addEventListener(
        "click",
        function(){

            togglePassword(
                registerPassword,
                this
            );

        }
    );



/* =========================================================
   MESSAGES
   ========================================================= */

function showMessage(
    element,
    text,
    type
){


    element.textContent =
        text;


    element.className =
        "message " + type;

}


function clearMessage(
    element
){


    element.textContent =
        "";


    element.className =
        "message";

}



/* =========================================================
   FIREBASE ERROR TRANSLATION
   ========================================================= */

function getArabicError(
    errorCode
){


    switch(errorCode){


        case "auth/email-already-in-use":

            return
                "هذا البريد الإلكتروني مسجل بالفعل.";


        case "auth/invalid-email":

            return
                "البريد الإلكتروني غير صحيح.";


        case "auth/weak-password":

            return
                "كلمة المرور ضعيفة. يجب أن تتكون من 6 أحرف على الأقل.";


        case "auth/invalid-credential":

            return
                "البريد الإلكتروني أو كلمة المرور غير صحيحة.";


        case "auth/user-not-found":

            return
                "لا يوجد حساب مسجل بهذا البريد الإلكتروني.";


        case "auth/wrong-password":

            return
                "كلمة المرور غير صحيحة.";


        case "auth/missing-password":

            return
                "يرجى كتابة كلمة المرور.";


        case "auth/too-many-requests":

            return
                "تم إجراء محاولات كثيرة. يرجى المحاولة لاحقًا.";


        case "auth/network-request-failed":

            return
                "تعذر الاتصال بالإنترنت. تحقق من الاتصال وحاول مرة أخرى.";


        case "auth/operation-not-allowed":

            return
                "تسجيل الدخول بهذه الطريقة غير مفعّل حاليًا.";


        default:

            return
                "حدث خطأ. يرجى المحاولة مرة أخرى.";

    }

}



/* =========================================================
   REGISTER
   ========================================================= */

registerForm.addEventListener(

    "submit",

    async function(event){


        event.preventDefault();


        clearMessage(
            registerMessage
        );


        const name =
            registerName.value.trim();


        const email =
            registerEmail.value.trim();


        const password =
            registerPassword.value;


        if(

            name === "" ||

            email === "" ||

            password === ""

        ){

            showMessage(

                registerMessage,

                "يرجى تعبئة جميع الحقول.",

                "error"

            );

            return;

        }


        registerSubmitBtn.disabled =
            true;


        registerSubmitBtn.textContent =
            "جارٍ إنشاء الحساب...";


        try{


            const userCredential =

                await
                createUserWithEmailAndPassword(

                    auth,

                    email,

                    password

                );


            await updateProfile(

                userCredential.user,

                {

                    displayName:name

                }

            );


            await setDoc(

                doc(

                    db,

                    "users",

                    userCredential.user.uid

                ),

                {

                    name:name,

                    email:email,

                    placementTestCompleted:false,

                    currentLevel:null,

                    lastLesson:null,

                    createdAt:
                        serverTimestamp(),

                    coins:0,

                    streak:0,

                    completedLessons:[],

                    completedUnits:[],

                    unlockedWords:[],

                    unlockedExpressions:[]

                }

            );


            showMessage(

                registerMessage,

                "تم إنشاء الحساب بنجاح. سيتم نقلك إلى المنصة.",

                "success"

            );


            setTimeout(

                function(){


                    window.location.href =
                        "home.html";


                },

                1500

            );

        }


        catch(error){


            showMessage(

                registerMessage,

                getArabicError(
                    error.code
                ),

                "error"

            );


            registerSubmitBtn.disabled =
                false;


            registerSubmitBtn.textContent =
                "إنشاء الحساب";

        }

    }

);



/* =========================================================
   LOGIN
   ========================================================= */

loginForm.addEventListener(

    "submit",

    async function(event){


        event.preventDefault();


        clearMessage(
            loginMessage
        );


        const email =
            loginEmail.value.trim();


        const password =
            loginPassword.value;


        if(

            email === "" ||

            password === ""

        ){

            showMessage(

                loginMessage,

                "يرجى كتابة البريد الإلكتروني وكلمة المرور.",

                "error"

            );

            return;

        }


        loginSubmitBtn.disabled =
            true;


        loginSubmitBtn.textContent =
            "جارٍ تسجيل الدخول...";


        try{


            await signInWithEmailAndPassword(

                auth,

                email,

                password

            );


            showMessage(

                loginMessage,

                "تم تسجيل الدخول بنجاح. سيتم نقلك إلى المنصة.",

                "success"

            );


            setTimeout(

                function(){


                    window.location.href =
                        "home.html";


                },

                1500

            );

        }


        catch(error){


            showMessage(

                loginMessage,

                getArabicError(
                    error.code
                ),

                "error"

            );


            loginSubmitBtn.disabled =
                false;


            loginSubmitBtn.textContent =
                "تسجيل الدخول";

        }

    }

);



/* =========================================================
   FORGOT PASSWORD
   ========================================================= */

forgotPassword.addEventListener(

    "click",

    async function(event){


        event.preventDefault();


        clearMessage(
            loginMessage
        );


        const email =
            loginEmail.value.trim();


        if(
            email === ""
        ){

            showMessage(

                loginMessage,

                "اكتب بريدك الإلكتروني أولًا، ثم اضغط على نسيت كلمة المرور.",

                "error"

            );


            loginEmail.focus();


            return;

        }


        try{


            await sendPasswordResetEmail(

                auth,

                email

            );


            showMessage(

                loginMessage,

                "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.",

                "success"

            );

        }


        catch(error){


            showMessage(

                loginMessage,

                getArabicError(
                    error.code
                ),

                "error"

            );

        }

    }

);

</script>
