========================================================== */

========================================================== */

auto-fit,
minmax(300px,1fr)

gap:26px;

}


/* ==========================================================
   الجوال
========================================================== */

.hero h1{

.hero p{

.balance{

.section-title{

font-size:28px;

}

.phrase-grid{

grid-template-columns:

========================================================== */

.phrase-card{

border-radius:28px;

padding:30px;

position:relative;

overflow:hidden;

transition:.28s;

}

.phrase-card:hover{

}


/* الخط الذهبي أعلى البطاقة */

.phrase-card::before{

content:"";

position:absolute;

top:0;

left:0;

right:0;

height:8px;

background:
linear-gradient(
90deg,
#ffd86b,
#ffb300
);

}


/* ==========================================================

========================================================== */

.phrase-header{

display:flex;

align-items:center;

gap:18px;

margin-bottom:22px;

}

.phrase-icon{

width:68px;

height:68px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

background:#fff8e6;

border:2px solid #ffe08a;

font-size:34px;

flex-shrink:0;

}

.phrase-title{

flex:1;

}

.phrase-title h3{

font-size:25px;

color:#1f3c88;

margin-bottom:7px;

}

.phrase-title p{

font-size:17px;

color:#888;

}


/* ==========================================================
   منطقة الفيديو
========================================================== */

.phrase-video{

width:100%;

aspect-ratio:16/9;

border-radius:20px;

overflow:hidden;

background:#f5f7ff;

margin-bottom:22px;

}

.phrase-video video{

width:100%;

height:100%;

display:block;

object-fit:cover;

}


/* ==========================================================
   البطاقة المغلقة
========================================================== */

.locked-content{

background:#f8f9ff;

border:2px solid #e4e8ff;

border-radius:20px;

padding:25px;

text-align:center;

}

.lock-icon{

font-size:48px;

margin-bottom:12px;

}

.locked-content h4{

font-size:22px;

color:#1f3c88;

margin-bottom:10px;

}

.locked-content p{

font-size:17px;

color:#777;

line-height:1.8;

margin-bottom:20px;

}


/* ==========================================================
   سعر العبارة
========================================================== */

.phrase-price{

display:inline-flex;

align-items:center;

justify-content:center;

gap:7px;

padding:10px 18px;

border-radius:999px;

background:#fff8e6;

border:2px solid #ffe08a;

color:#e09a00;

font-size:20px;

font-weight:bold;

margin-bottom:18px;

}


/* ==========================================================
   زر فتح العبارة
========================================================== */

.unlock-btn{

width:100%;

border:none;

padding:16px;

border-radius:18px;

background:
linear-gradient(
90deg,
#3768ff,
#6f43ff
);

color:white;

font-size:19px;

font-weight:bold;

cursor:pointer;

transition:.25s;

box-shadow:
0 10px 25px
rgba(55,104,255,.25);

}

.unlock-btn:hover{

transform:
translateY(-3px);

}

.unlock-btn:disabled{

opacity:.6;

cursor:not-allowed;

transform:none;

}


/* ==========================================================
   العبارة المفتوحة
========================================================== */

.unlocked-content{

display:none;

}


/* حالة الفتح */

.phrase-card.unlocked
.unlocked-content{

display:block;

}


/* إخفاء القفل بعد الفتح */

.phrase-card.unlocked
.locked-content{

display:none;

}


/* ==========================================================
   شارة العبارة المفتوحة
========================================================== */

.unlocked-badge{

display:inline-flex;

align-items:center;

gap:7px;

padding:9px 15px;

border-radius:999px;

background:#eef4ff;

border:2px solid #dce5ff;

color:#1f3c88;

font-size:16px;

font-weight:bold;

margin-bottom:18px;

}

========================================================== */

margin-bottom:15px;

}

// ==========================================================
// 🔊 تشغيل نطق العبارة
// ==========================================================

function speakPhrase(text,button){

if(!("speechSynthesis" in window)){

alert(
"⚠️ المتصفح لا يدعم تشغيل النطق الصوتي."
);

return;

}

window.speechSynthesis.cancel();

const utterance =
new SpeechSynthesisUtterance(text);

utterance.lang="en-US";

utterance.rate=.88;

utterance.pitch=1;

button.disabled=true;

const originalText =
button.innerHTML;

button.innerHTML=
"🔊 يتم النطق...";

utterance.onend=()=>{

button.disabled=false;

button.innerHTML=
originalText;

};

utterance.onerror=()=>{

button.disabled=false;

button.innerHTML=
originalText;

};

window.speechSynthesis.speak(
utterance
);

}

import{

auth,
db

}from "./js/firebase.js";


import{

doc,
getDoc,
updateDoc,
arrayUnion,
increment

}from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


import{

onAuthStateChanged

}from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import{

playPurchaseSound,
unlockCoinSound

}from "./js/reward.js?v=2";


// ==========================================================
// التحقق من المستخدم والعبارات المملوكة
// ==========================================================

async function loadPhraseOwnership(user){

if(!user){

return;

}


const userRef=

doc(
db,
"users",
user.uid
);


const snap=

await getDoc(userRef);


if(!snap.exists()){

return;

}


const data=
snap.data();


const ownedPhrases=
data.ownedPhrases || [];


phrases.forEach(phrase=>{

const card=
document.querySelector(

`.phrase-card[data-id="${phrase.id}"]`

);


if(!card){

return;

}


if(
ownedPhrases.includes(
phrase.id
)
){

card.classList.add(
"unlocked"
);

}

});

}


// ==========================================================
// شراء العبارة
// ==========================================================

async function unlockPhrase(

phrase,
button

){

const user=
auth.currentUser;


if(!user){

alert(
"⚠️ يجب تسجيل الدخول أولًا."
);

return;

}


button.disabled=true;

unlockCoinSound();


try{

const userRef=
doc(
db,
"users",
user.uid
);


const snap=
await getDoc(
userRef
);


if(!snap.exists()){

alert(
"⚠️ لم يتم العثور على حسابك."
);

button.disabled=false;

return;

}


const data=
snap.data();


const coins=
data.coins || 0;


const ownedPhrases=
data.ownedPhrases || [];


// ==========================================================
// العبارة مملوكة مسبقًا
// ==========================================================

if(
ownedPhrases.includes(
phrase.id
)
){

const card=
document.querySelector(

`.phrase-card[data-id="${phrase.id}"]`

);


if(card){

card.classList.add(
"unlocked"
);

}

button.disabled=false;

return;

}


// ==========================================================
// التحقق من الرصيد
// ==========================================================

if(
coins < phrase.price
){

alert(

`🪙 رصيدك غير كافٍ.\n\nرصيدك الحالي: ${coins} كوينز\nسعر العبارة: ${phrase.price} كوينز`

);

button.disabled=false;

return;

}


// ==========================================================
// تأكيد الشراء
// ==========================================================

const confirmed=
confirm(

`هل تريد فتح هذه العبارة مقابل ${phrase.price} كوينز؟`

);


if(!confirmed){

button.disabled=false;

return;

}


// ==========================================================
// خصم العملات وحفظ العبارة
// ==========================================================

await updateDoc(

userRef,

{

coins:
increment(
-phrase.price
),

ownedPhrases:
arrayUnion(
phrase.id
)

}

);


// ==========================================================
// 🔊 صوت نجاح الشراء
// ==========================================================

playPurchaseSound();


// ==========================================================
// فتح البطاقة مباشرة
// ==========================================================

const card=
document.querySelector(

`.phrase-card[data-id="${phrase.id}"]`

);


if(card){

card.classList.add(
"unlocked"
);

}


// ==========================================================
// تحديث الرصيد أعلى الصفحة
// ==========================================================

const balance=
document.getElementById(
"coinBalance"
);


if(balance){

balance.textContent=
coins - phrase.price;

}


}catch(error){

console.error(
"Phrase purchase error:",
error
);

alert(

"⚠️ حدث خطأ أثناء فتح العبارة. حاول مرة أخرى."

);

}


button.disabled=false;

}


// ==========================================================
// ربط أزرار فتح العبارات
// ==========================================================

document
.querySelectorAll(
".phrase-card"
)
.forEach(card=>{

const phraseId=
card.dataset.id;


const phrase=
phrases.find(

item=>
item.id===
phraseId

);


const button=
card.querySelector(
".unlock-btn"
);


if(!phrase || !button){

return;

}


button.addEventListener(

"click",

()=>{

unlockPhrase(

phrase,
button

);

}

);

});


// ==========================================================
// تشغيل النظام بعد التأكد من تسجيل الدخول
// ==========================================================

onAuthStateChanged(

auth,

async(user)=>{

if(!user){

return;

}


const userRef=
doc(
db,
"users",
user.uid
);


const snap=
await getDoc(
userRef
);


if(!snap.exists()){

return;

}


const data=
snap.data();


const coins=
data.coins || 0;


const balance=
document.getElementById(
"coinBalance"
);


if(balance){

balance.textContent=
coins;

}


await loadPhraseOwnership(
user
);

}

);

</script>
